const { useState, useEffect, useRef, useMemo, useCallback } = React;

const STORAGE_KEY = "household-ledger-v1";
const TITLE_KEY = "household-ledger-title-v1";
const THEME_KEY = "household-ledger-theme-v1";
const DEFAULT_TITLE = "Personal Finances";

const genId = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
const monthKeyFromDate = (date = new Date()) => {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  return `${year}-${month}`;
};
const nextMonthKey = (monthKey) => {
  const [year, month] = (monthKey || monthKeyFromDate()).split("-").map(Number);
  const next = new Date(year, month, 1);
  return monthKeyFromDate(next);
};
const formatMonthLabel = (monthKey) => {
  if (!/^\d{4}-\d{2}$/.test(monthKey || "")) return "This month";
  return new Date(`${monthKey}-01T12:00:00`).toLocaleDateString("en-US", {
    month: "long",
    year: "numeric",
  });
};

const fmt = (n) =>
  (Number.isFinite(n) ? n : 0).toLocaleString("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });

const money = (value) => {
  const amount = parseFloat(value);
  return Number.isFinite(amount) ? Math.round((amount + Number.EPSILON) * 100) / 100 : 0;
};
const moneyText = (value) => (value === "" ? "" : money(value).toFixed(2));

const sum = (arr) => money(arr.reduce((acc, it) => acc + money(it.amount), 0));

const signedTotal = (items, account) =>
  items
    .filter((i) => i.account === account)
    .reduce((acc, i) => {
      const amt = money(i.amount);
      return acc + (i.direction === "add" ? amt : -amt);
    }, 0);

const ORDERED_LIST_KEYS = ["monthlyItems", "annualItems", "incomeItems", "extraItems", "calculatorItems"];
const withEntryOrder = (ledger) => {
  const ordered = { ...ledger };
  ORDERED_LIST_KEYS.forEach((key) => {
    ordered[key] = (ledger[key] || []).map((item, index) => ({
      ...item,
      entryOrder: Number.isFinite(item.entryOrder) ? item.entryOrder : index,
    }));
  });
  return ordered;
};
const nextEntryOrder = (items) => Math.max(-1, ...items.map((item) => Number(item.entryOrder) || 0)) + 1;

    function useSortableList(onReorder) {
      const [draggingId, setDraggingId] = useState(null);
      const [overId, setOverId] = useState(null);

      const startDrag = useCallback((id) => {
        setDraggingId(id);
      }, []);

      // Only updates which row is currently highlighted as the drop target.
      // Does NOT reorder the underlying data — that happens once, on drop.
      const dragOverRow = useCallback((id) => {
        setOverId((prev) => (prev === id ? prev : id));
      }, []);

      const dropOnRow = useCallback(
        (id) => {
          setDraggingId((current) => {
            if (current && current !== id) {
              onReorder(current, id);
            }
            return null;
          });
          setOverId(null);
        },
        [onReorder]
      );

      const endDrag = useCallback(() => {
        setDraggingId(null);
        setOverId(null);
      }, []);

      return { draggingId, overId, startDrag, dragOverRow, dropOnRow, endDrag };
    }

    // Sorting is intentionally display-only: returning to the default state shows
    // the order in which items were entered and does not change any item data.
    function useTableSort(items) {
      const [sort, setSort] = useState({ key: null, direction: null });
      const toggleSort = useCallback((key) => {
        setSort((current) => {
          if (current.key !== key) return { key, direction: "asc" };
          if (current.direction === "asc") return { key, direction: "desc" };
          return { key: null, direction: null };
        });
      }, []);
      const sortedItems = useMemo(() => {
        const inEntryOrder = () => items
          .map((item, index) => ({ item, index }))
          .sort((a, b) => (a.item.entryOrder - b.item.entryOrder) || a.index - b.index)
          .map(({ item }) => item);
        if (!sort.key || !sort.direction) return inEntryOrder();
        const valueFor = (item) => {
          if (sort.key === "name") return (item.name || "").trim().toLocaleLowerCase();
          if (sort.key === "amount") return Number(item.amount) || 0;
          if (sort.key === "date") return item.dueDate || (item.dueDay ? String(item.dueDay).padStart(2, "0") : "");
          return "";
        };
        const direction = sort.direction === "asc" ? 1 : -1;
        return items
          .map((item, index) => ({ item, index, value: valueFor(item) }))
          .sort((a, b) => {
            // Keep blank dates at the end in either direction.
            if (a.value === "" && b.value !== "") return 1;
            if (a.value !== "" && b.value === "") return -1;
            const comparison = typeof a.value === "string"
              ? a.value.localeCompare(b.value, undefined, { numeric: true })
              : a.value - b.value;
            return comparison ? comparison * direction : a.index - b.index;
          })
          .map(({ item }) => item);
      }, [items, sort]);
      return { sortedItems, sort, toggleSort };
    }

    function SortHeader({ label, column, sort, onSort, className = "" }) {
      const active = sort.key === column;
      const icon = active ? (sort.direction === "asc" ? "↑" : "↓") : "↕";
      const nextAction = !active || sort.direction === "desc"
        ? `sort ${label.toLowerCase()} ascending`
        : "sort descending";
      return (
        <span className={`sort-header ${className}`}>
          <span>{label}</span>
          <button
            type="button"
            className={`sort-button ${active ? "is-active" : ""}`}
            onClick={() => onSort(column)}
            title={`Click to ${nextAction}; click again to reverse; click once more for default order`}
            aria-label={`Sort by ${label}: ${active ? sort.direction : "default order"}`}
          >{icon}</button>
        </span>
      );
    }

function LineItemTable({
  title,
  subtitle,
  items,
  onChange,
  onAdd,
  onRemove,
  onReorder,
  showType,
  addLabel,
  emptyLabel,
  footerNote,
}) {
  const { draggingId, overId, startDrag, dragOverRow, dropOnRow, endDrag } = useSortableList(onReorder);
  const { sortedItems, sort, toggleSort } = useTableSort(items);
  const nameInputRefs = useRef({});
  const prevCountRef = useRef(items.length);
  useEffect(() => {
    if (items.length > prevCountRef.current) {
      const lastItem = items[items.length - 1];
      const el = nameInputRefs.current[lastItem.id];
      if (el) el.focus();
    }
    prevCountRef.current = items.length;
  }, [items.length]);
  return (
    <section className="ledger-panel">
      <div className="panel-head">
        <h2>{title}</h2>
        {subtitle && <p className="panel-sub">{subtitle}</p>}
      </div>

<div className="table-wrap">
        <div className={`row row-head ${showType ? "with-type" : ""}`}>
          <span />
          <SortHeader label="Item" column="name" sort={sort} onSort={toggleSort} />
          {showType && <span>Type</span>}
          <SortHeader label="Amount" column="amount" sort={sort} onSort={toggleSort} className="num" />
          <span className="row-action" />
        </div>

        {items.length === 0 && <div className="empty-row">{emptyLabel}</div>}

        {sortedItems.map((item) => (
          <div 
            key={item.id}
            className={`row ${showType ? "with-type" : ""} ${draggingId === item.id ? "dragging" : ""} ${overId === item.id && draggingId && draggingId !== item.id ? "drag-over-target" : ""}`}
            onDragOver={(e) => {
              if (!draggingId) return;
              e.preventDefault();
              dragOverRow(item.id);
            }}
            onDrop={(e) => {
              if (!draggingId) return;
              e.preventDefault();
              dropOnRow(item.id);
            }}
          >
            <div
              className="drag-handle"
              title="Drag to reorder"
              draggable
              onDragStart={(e) => {
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", item.id);
                const rowEl = e.currentTarget.closest(".row");
                if (rowEl && e.dataTransfer.setDragImage) {
                  e.dataTransfer.setDragImage(rowEl, 20, 20);
                }
                startDrag(item.id);
              }}
              onDragEnd={endDrag}
            >
              ⋮⋮
            </div>

            <input
              className="cell-input name-input"
              type="text"
              value={item.name}
              placeholder="Item name"
              ref={(el) => {
                if (el) nameInputRefs.current[item.id] = el;
                else delete nameInputRefs.current[item.id];
              }}
              onChange={(e) => onChange(item.id, { name: e.target.value })}
            />

            {showType && (
              <div className="type-toggle">
                <button
                  type="button"
                  className={item.type === "fixed" ? "active" : ""}
                  onClick={() => onChange(item.id, { type: "fixed" })}
                >
                  Fixed
                </button>
                <button
                  type="button"
                  className={item.type === "variable" ? "active" : ""}
                  onClick={() => onChange(item.id, { type: "variable" })}
                >
                  Estimate
                </button>
              </div>
            )}

            <div className="amount-field">
              <span className="dollar">$</span>
              <input
                className="cell-input num-input"
                type="number"
                step="0.01"
                min="0"
                inputMode="decimal"
                value={item.amount}
                onChange={(e) =>
                  onChange(item.id, { amount: e.target.value === "" ? "" : money(e.target.value) })
                }
                onBlur={(e) => onChange(item.id, { amount: moneyText(e.target.value) })}
              />
            </div>

            <button className="row-remove" onClick={() => onRemove(item.id)} aria-label={`Remove ${item.name}`}>
              ×
            </button>
          </div>
        ))}
      </div>

      <div className="panel-foot">
        <button className="add-btn" onClick={onAdd}>
          + {addLabel}
        </button>
        {footerNote && <span className="foot-note">{footerNote}</span>}
      </div>
    </section>
  );
}

function ExtraItemsTable({
    items,
    onChange,
    onAdd,
    onRemove,
    onReorder,
    onClearAll,
    onUndoClear,
    canUndoClear,
    onMarkPaid,
    onMarkUnpaid,
    onUndoPaid,
    canUndoPaid,
}) {
  const { draggingId, overId, startDrag, dragOverRow, dropOnRow, endDrag } = useSortableList(onReorder);
  const { sortedItems, sort, toggleSort } = useTableSort(items);
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const nameInputRefs = useRef({});
  const prevCountRef = useRef(items.length);
  useEffect(() => {
    if (items.length > prevCountRef.current) {
      const lastItem = items[items.length - 1];
      const el = nameInputRefs.current[lastItem.id];
      if (el) el.focus();
    }
    prevCountRef.current = items.length;
  }, [items.length]);

  const toggleSelect = (id) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const allSelected = items.length > 0 && selectedIds.size === items.length;
  const toggleSelectAll = () => {
    if (allSelected) {
      setSelectedIds(new Set());
    } else {
      setSelectedIds(new Set(items.map((i) => i.id)));
    }
  };

  const handleRemove = (id) => {
    setSelectedIds((prev) => {
      if (!prev.has(id)) return prev;
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
    onRemove(id);
  };

  const handleMarkPaid = () => {
    if (selectedIds.size === 0) return;
    onMarkPaid(Array.from(selectedIds));
    setSelectedIds(new Set());
  };

  const handleMarkUnpaid = () => {
    if (selectedIds.size === 0) return;
    onMarkUnpaid(Array.from(selectedIds));
    setSelectedIds(new Set());
  };

  return (
    <div className="table-wrap extra-table">
<div className="row extra-row row-head">
        <span />
        <input 
          type="checkbox" 
          className="row-select" 
          checked={allSelected} 
          onChange={toggleSelectAll} 
          title="Select all"
          disabled={items.length === 0}
        />
        <SortHeader label="Item" column="name" sort={sort} onSort={toggleSort} />
        <span>Account</span>
        <span>Direction</span>
        <SortHeader label="Due date" column="date" sort={sort} onSort={toggleSort} />
        <SortHeader label="Amount" column="amount" sort={sort} onSort={toggleSort} className="num" />
        <span className="row-action" />
      </div>

      {items.length === 0 && (
        <div className="empty-row">No transactions yet — log a car repair, a bonus, a big purchase, etc.</div>
      )}

      {sortedItems.map((item) => (
        <div 
          key={item.id}
          className={`row extra-row ${draggingId === item.id ? "dragging" : ""} ${overId === item.id && draggingId && draggingId !== item.id ? "drag-over-target" : ""} ${item.paid ? "paid" : ""} ${item.direction === "add" ? "received" : ""}`}
          onDragOver={(e) => {
            if (!draggingId) return;
            e.preventDefault();
            dragOverRow(item.id);
          }}
          onDrop={(e) => {
            if (!draggingId) return;
            e.preventDefault();
            dropOnRow(item.id);
          }}
        >
          <div
            className="drag-handle"
            title="Drag to reorder"
            draggable
            onDragStart={(e) => {
              e.dataTransfer.effectAllowed = "move";
              e.dataTransfer.setData("text/plain", item.id);
              const rowEl = e.currentTarget.closest(".row");
              if (rowEl && e.dataTransfer.setDragImage) {
                e.dataTransfer.setDragImage(rowEl, 20, 20);
              }
              startDrag(item.id);
            }}
            onDragEnd={endDrag}
          >
            ⋮⋮
          </div>

          <input
            type="checkbox"
            className="row-select"
            checked={selectedIds.has(item.id)}
            onChange={() => toggleSelect(item.id)}
            aria-label={item.paid ? `${item.name} (paid) — select to edit again` : `Select ${item.name}`}
            title={item.paid ? "Select, then click \"Mark Unpaid\" to edit again" : "Select to mark as paid"}
          />

          <input
            className="cell-input name-input"
            type="text"
            value={item.name}
            placeholder="e.g. Car repair"
            disabled={item.paid}
            ref={(el) => {
              if (el) nameInputRefs.current[item.id] = el;
              else delete nameInputRefs.current[item.id];
            }}
            onChange={(e) => onChange(item.id, { name: e.target.value })}
          />

          <select
            className="mini-select"
            value={item.direction === "add" ? "savings" : item.account}
            disabled={item.paid || item.direction === "add"}
            title={item.direction === "add" ? "Received items always go to savings" : undefined}
            onChange={(e) => onChange(item.id, { account: e.target.value })}
          >
            <option value="checking">Checking</option>
            <option value="savings">Savings</option>
          </select>

          <select
            className="mini-select"
            value={item.direction}
            disabled={item.paid}
            onChange={(e) => {
              const direction = e.target.value;
              // Received money always lands in savings, not checking
              onChange(item.id, {
                direction,
                account: direction === "add" ? "savings" : item.account,
              });
            }}
          >
            <option value="subtract">Spent (−)</option>
            <option value="add">Received (+)</option>
          </select>

          <input
            className="cell-input date-input"
            type="date"
            value={item.dueDate || toDateInputValue(nextMonthlyOccurrence(item.dueDay))}
            disabled={item.paid}
            onChange={(e) => onChange(item.id, { dueDate: e.target.value })}
            aria-label={`Due date for ${item.name || "item"}`}
          />

          <div className="amount-field">
            <span className="dollar">$</span>
            <input
              className="cell-input num-input"
              type="number"
              step="0.01"
              min="0"
              inputMode="decimal"
              value={item.amount}
              disabled={item.paid}
              onChange={(e) =>
                onChange(item.id, { amount: e.target.value === "" ? "" : money(e.target.value) })
              }
              onBlur={(e) => onChange(item.id, { amount: moneyText(e.target.value) })}
            />
          </div>

          <button className="row-remove" onClick={() => handleRemove(item.id)} aria-label={`Remove ${item.name}`}>
            ×
          </button>
        </div>
      ))}

      <div className="panel-foot">
          <div style={{display: "flex", gap: "8px", flexWrap: "wrap"}}>
              <button className="add-btn" onClick={onAdd}>
                  + Add transaction
              </button>

              <button
                  className="add-btn"
                  onClick={handleMarkPaid}
                  disabled={selectedIds.size === 0}
              >
                  Paid{selectedIds.size > 0 ? ` (${selectedIds.size})` : ""}
              </button>

              <button
                  className="add-btn"
                  onClick={handleMarkUnpaid}
                  disabled={selectedIds.size === 0}
                  title="Select paid item(s) above, then click here to unlock them for editing again"
              >
                  Mark Unpaid
              </button>

              <button
                  className="add-btn"
                  onClick={onUndoPaid}
                  disabled={!canUndoPaid}
              >
                  Undo Paid
              </button>

              <button
                  className="add-btn danger"
                  onClick={onClearAll}
                  disabled={items.length === 0}
              >
                  Clear All
              </button>

              <button
                  className="add-btn"
                  onClick={onUndoClear}
                  disabled={!canUndoClear}
              >
                  Undo Clear
              </button>
          </div>
      </div>
    </div>
  );
}

function ItemCalculatorTable({ items, onChange, onAdd, onRemove, onDeleteSelected, onDimSelected, onUndimSelected, onReorder, open, onToggleOpen }) {
  const { draggingId, overId, startDrag, dragOverRow, dropOnRow, endDrag } = useSortableList(onReorder);
  const { sortedItems, sort, toggleSort } = useTableSort(items);
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const nameInputRefs = useRef({});
  const prevCountRef = useRef(items.length);

  useEffect(() => {
    if (items.length > prevCountRef.current) {
      const lastItem = items[items.length - 1];
      nameInputRefs.current[lastItem.id]?.focus();
    }
    prevCountRef.current = items.length;
    setSelectedIds((prev) => new Set([...prev].filter((id) => items.some((item) => item.id === id))));
  }, [items]);

  const toggleSelect = (id) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };
  const allSelected = items.length > 0 && items.every((item) => selectedIds.has(item.id));
  const toggleSelectAll = () => setSelectedIds(allSelected ? new Set() : new Set(items.map((item) => item.id)));
  const removeOne = (id) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
    onRemove(id);
  };
  const deleteSelected = () => {
    if (!selectedIds.size) return;
    onDeleteSelected([...selectedIds]);
    setSelectedIds(new Set());
  };
  const dimSelected = () => {
    if (!selectedIds.size) return;
    onDimSelected([...selectedIds]);
    setSelectedIds(new Set());
  };
  const undimSelected = () => {
    if (!selectedIds.size) return;
    onUndimSelected([...selectedIds]);
    setSelectedIds(new Set());
  };
  const total = items.reduce((sum, item) => {
    if (item.dimmed) return sum;
    const amount = parseFloat(item.amount) || 0;
    return sum + (item.direction === "add" ? amount : -amount);
  }, 0);

  return (
    <section className="ledger-panel wide-panel">
      <div className="panel-head calculator-panel-head">
        <div className="calculator-head-text">
          <h2>Item calculator</h2>
          <p className="panel-sub">Add a quick list of costs and credits without changing any real balances. Use + or − to include each item as an addition or subtraction.</p>
        </div>
        <button
          type="button"
          className="collapse-toggle"
          onClick={onToggleOpen}
          aria-expanded={open}
          title={open ? "Collapse the item calculator" : "Expand the item calculator"}
        >
          <span className={`collapse-arrow ${open ? "is-open" : ""}`} aria-hidden="true">▸</span>
          {open ? "Collapse" : "Expand"}
        </button>
      </div>
      {open && (
        <React.Fragment>
          <div className="table-wrap calculator-table">
            <div className="row calculator-row row-head">
              <span />
              <input type="checkbox" className="row-select" checked={allSelected} onChange={toggleSelectAll} title="Select all" disabled={!items.length} />
              <SortHeader label="Item" column="name" sort={sort} onSort={toggleSort} />
              <span>Operation</span>
              <SortHeader label="Amount" column="amount" sort={sort} onSort={toggleSort} className="num" />
              <span className="row-action" />
            </div>
            {!items.length && <div className="empty-row">No calculator items yet — add an item to start totaling.</div>}
            {sortedItems.map((item) => (
              <div
                key={item.id}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(dateStr + "T00:00:00");
  if (isNaN(due.getTime())) return null;
  return Math.round((due - today) / 86400000);
}

// Given a recurring day-of-month (1-31), finds the next calendar date it falls
// on from today, clamping to the last day of a month when it's too short
// (e.g. a "31st" bill lands on Feb 28/29 that month).
function nextMonthlyOccurrence(day) {
  const d = parseInt(day, 10);
  if (!d || d < 1 || d > 31) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const clampToMonth = (year, month) => {
    const lastDay = new Date(year, month + 1, 0).getDate();
    return new Date(year, month, Math.min(d, lastDay));
  };
  let candidate = clampToMonth(today.getFullYear(), today.getMonth());
  if (candidate < today) {
    candidate = clampToMonth(today.getFullYear(), today.getMonth() + 1);
  }
  return candidate;
}

function toDateInputValue(date) {
  if (!date) return "";
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function daysUntilMonthly(day) {
  const due = nextMonthlyOccurrence(day);
  if (!due) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((due - today) / 86400000);
}

const WEATHER_CACHE_KEY = "household-ledger-weather-v1";
// How long a cached reading (and the location fix that produced it) stays
// good for. Skipping the geolocation call entirely while the cache is fresh
// is what keeps the browser from re-showing the location permission prompt
// on every single page load.
const WEATHER_CACHE_MS = 30 * 60 * 1000; // 30 minutes

function readWeatherCache() {
  try {
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed.ts !== "number") return null;
    return parsed;
  } catch (err) {
    return null;
  }
}

function writeWeatherCache(entry) {
  try {
    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(entry));
  } catch (err) {
    console.error("Weather cache save error:", err);
  }
}

function WeatherWidget() {
  // idle -> asking -> ok | denied | error
  const [state, setState] = useState("idle");
  const [weather, setWeather] = useState(null);

  const fetchWeather = useCallback((force) => {
    // Reuse a recent reading instead of asking the browser for location
    // again — the permission prompt only shows up when getCurrentPosition
    // is actually called, so this is what keeps a granted "Allow" from
    // feeling like it needs to be re-confirmed every reload.
    if (!force) {
      const cached = readWeatherCache();
      if (cached && Date.now() - cached.ts < WEATHER_CACHE_MS) {
        setWeather({ temp: cached.temp, code: cached.code });
        setState("ok");
        return;
      }
    }

    if (!("geolocation" in navigator)) {
      setState("error");
      return;
    }
    setState("asking");
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          const { latitude, longitude } = pos.coords;
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;
          const res = await fetch(url);
          const json = await res.json();
          const temp = json?.current?.temperature_2m;
          const code = json?.current?.weather_code;
          if (temp === undefined) throw new Error("No temperature in response");
          const rounded = Math.round(temp);
          setWeather({ temp: rounded, code });
          setState("ok");
          writeWeatherCache({ temp: rounded, code, lat: latitude, lon: longitude, ts: Date.now() });
        } catch (err) {
          console.error("Weather fetch error:", err);
          setState("error");
        }
      },
      (err) => {
        console.warn("Geolocation denied/unavailable:", err);
        setState("denied");
      },
      { timeout: 8000 }
    );
  }, []);

  useEffect(() => {
    fetchWeather(false);
  }, [fetchWeather]);

  if (state === "idle" || state === "asking") {
    return (
      <div className="weather-chip">
        <span className="weather-icon">⋯</span> Checking weather…
      </div>
    );
  }

  if (state === "denied" || state === "error") {
    return (
      <div className="weather-chip">
        <span className="weather-icon">🌡️</span>
        <span>Weather unavailable</span>
        <button onClick={() => fetchWeather(true)}>Retry</button>
      </div>
    );
  }

  const [icon, label] = WEATHER_CODES[weather.code] || ["🌡️", "—"];

  return (
    <div className="weather-chip" title={label}>
      <span className="weather-icon">{icon}</span>
      <span className="weather-temp">{weather.temp}°F</span>
      <span>{label}</span>
    </div>
  );
}

// Merges recurring fixed/estimated monthly items (by day-of-month) with
// one-time annual bills (by exact date) into a single, soonest-first
// reminder list.
function UpcomingBillsPanel({ monthlyItems, annualItems }) {
  const upcoming = useMemo(() => {
    const fromMonthly = monthlyItems
      .filter((it) => !it.dimmed && it.dueDay)
      .map((it) => ({
        id: it.id,
        name: it.name,
        amount: it.amount,
        remaining: daysUntilMonthly(it.dueDay),
        tag: it.type === "fixed" ? "Monthly" : "Monthly · estimate",
      }));

  const fromAnnual = annualItems
    .filter((it) => !it.movedThisCycle && it.dueDate)
    .map((it) => ({
      id: it.id,
      name: it.name,
      amount: it.amount,
      remaining: daysUntil(it.dueDate),
      tag: "Annual",
    }))
    .filter((it) => it.remaining !== null && it.remaining <= 60);

    return [...fromMonthly, ...fromAnnual]
      .filter((it) => it.remaining !== null)
      .sort((a, b) => a.remaining - b.remaining)
      .slice(0, 8);
  }, [monthlyItems, annualItems]);

  if (upcoming.length === 0) return null;

  return (
    <section className="ledger-panel wide-panel">
      <div className="panel-head">
        <h2>Bills due soon</h2>
        <p className="panel-sub">
          Pulled automatically from the due days you set on monthly items and the due dates on annual
          bills below — soonest first.
        </p>
      </div>
      <div className="upcoming-bills">
        {upcoming.map((it) => (
          <div key={it.id} className="upcoming-bill-row">
            <div className="upcoming-bill-name">
              <span>{it.name}</span>
              <span className="upcoming-bill-tag">{it.tag}</span>
            </div>
            <span className="upcoming-bill-amount">{fmt(it.amount)}</span>
            <span className={`due-badge ${it.remaining < 0 ? "overdue" : it.remaining <= 3 ? "soon" : ""}`}>
              {it.remaining < 0
                ? `${Math.abs(it.remaining)}d overdue`
                : it.remaining === 0
                ? "Due today"
                : `in ${it.remaining}d`}
            </span>
          </div>
        ))}
      </div>
    </section>
  );
}

function MonthlySavingsTracker({ income, spent, projectedSpent, tracker, onMonthChange, onAddIncome, onChangeIncome, onRemoveIncome }) {

  const savedSoFar = money(income - spent);
  const projectedSaved = money(income - projectedSpent);
  const actualIncomeItems = tracker?.actualIncomeByMonth?.[activeMonth] || [];
  const actualIncome = sum(actualIncomeItems);
  const actualSaved = money(actualIncome - spent);
  const history = [...(tracker?.history || [])].sort((a, b) => b.month.localeCompare(a.month));

  return (
    <section className="ledger-panel wide-panel savings-tracker-panel">
      <div className="panel-head tracker-head">
        <div>
          <h2>Monthly savings tracker</h2>
          <p className="panel-sub">
            Compare your planned income with the real deposits you receive. Spending updates automatically
            when you mark transactions as paid.
          </p>
        </div>
        <label className="tracker-month-picker">
          <span className="field-label">Tracking month</span>
          <input
            className="cell-input"
            type="month"
            value={activeMonth}
            onChange={(e) => onMonthChange(e.target.value || monthKeyFromDate())}
            aria-label="Month being tracked"
          />
        </label>
      </div>

      <div className="tracker-metrics">
        <div className="tracker-stat">
          <span className="summary-label">Projected monthly income</span>
          <strong>{fmt(income)}</strong>
        </div>
        <div className="tracker-stat">
          <span className="summary-label">Spent this month</span>
          <strong className="negative">{fmt(spent)}</strong>
        </div>
        <div className="tracker-stat">
          <span className="summary-label">Projected actual spent</span>
          <strong className="negative">{fmt(projectedSpent)}</strong>
        </div>
        <div className="tracker-stat">
          <span className="summary-label">Saved so far</span>
          <strong className={savedSoFar < 0 ? "negative" : "income"}>{fmt(savedSoFar)}</strong>
        </div>
        <div className="tracker-stat tracker-saved">
          <span className="summary-label">Projected savings</span>
          <strong className={projectedSaved < 0 ? "negative" : "income"}>{fmt(projectedSaved)}</strong>
        </div>
      </div>

      <div className="tracker-actual-income">
        <div className="tracker-actual-head">
          <div>
            <span className="summary-label">Actual {formatMonthLabel(activeMonth)} income</span>
            <p className="foot-note">Add each paycheck, deposit, or other income received during this month.</p>
          </div>
          <div className="tracker-actual-total">
            <span className="summary-label">Actual savings</span>
            <strong className={actualSaved < 0 ? "negative" : "income"}>{fmt(actualSaved)}</strong>
          </div>
        </div>
        <div className="tracker-income-list">
          {actualIncomeItems.length === 0 && (
            <p className="foot-note tracker-income-empty">No actual income entered for this month yet.</p>
          )}
          {actualIncomeItems.map((item) => (
            <div className="tracker-income-row" key={item.id}>
              <input
                className="cell-input"
                type="text"
                value={item.name}
                placeholder="Income source"
                onChange={(e) => onChangeIncome(item.id, { name: e.target.value })}
              />
              <div className="amount-field">
                <span className="dollar">$</span>
                <input
                  className="cell-input num-input"
                  type="number"
                  min="0"
                  step="0.01"
                  inputMode="decimal"
                  value={item.amount}
                  onChange={(e) => onChangeIncome(item.id, { amount: e.target.value === "" ? "" : money(e.target.value) })}
                  onBlur={(e) => onChangeIncome(item.id, { amount: moneyText(e.target.value) })}
                />
              </div>

            </div>

function ProjectionsPanel({ income, monthlyExpenses, currentSavings, projections, onProjectionsChange }) {
  // Periods, surprise buffer, and savings goal all live in the parent's
  // `data` state now (see App's `projections` field) so they persist to
  // localStorage just like everything else on the page.
  const { periods, surpriseBuffer, savingsGoal } = projections;

  const monthlyNet = income - monthlyExpenses - surpriseBuffer;

  const setSurpriseBuffer = (value) => onProjectionsChange({ surpriseBuffer: value });
  const setSavingsGoal = (value) => onProjectionsChange({ savingsGoal: value });

  const handlePeriodChange = (index, newValue) => {
    const updated = [...periods];
    updated[index] = newValue === "" ? "" : parseInt(newValue, 10);
    onProjectionsChange({ periods: updated });
  };

  const addPeriod = () => {
    // Default a new period to 24 months
    onProjectionsChange({ periods: [...periods, 24] });
  };

  const removePeriod = (index) => {
    onProjectionsChange({ periods: periods.filter((_, i) => i !== index) });
  };

  const AXIS_TICKS = [100, 75, 50, 25, 0];
  const CHART_HEIGHT = 180;
  const AXIS_WIDTH = 30;
  const CHART_GAP = 16;

  return (
    <section className="ledger-panel wide-panel">
      <div className="panel-head">
        <h2>Projected Savings</h2>
      </div>
      
      {/* Side-by-Side Layout Grid */}
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: "20px", alignItems: "stretch" }} className="projections-split-grid">
        
        {/* Left Side: Inputs */}
        <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
          <p className="panel-sub" style={{ margin: 0 }}>
            Displays projected cash flow across future intervals based on your monthly income minus your monthly spending bills, starting with your current savings balance. Edit the months below to set custom milestones!
          </p>

          <div className="balance-block" style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              <span className="field-label" style={{ marginBottom: 0, width: "170px", flexShrink: 0, whiteSpace: "normal" }}>Optional surprise buffer / month (Surprise bills):</span>
              <div className="amount-field big" style={{ flex: 1 }}>
                <span className="dollar">$</span>
                <input
                  className="cell-input num-input"
                  type="number"
                  min="0"
                  step="0.01"
                  value={surpriseBuffer}
                  onChange={(e) => setSurpriseBuffer(e.target.value === "" ? 0 : money(e.target.value))}
                />
              </div>
          </div>

          <div className="balance-block" style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              <span className="field-label" style={{ marginBottom: 0, width: "170px", flexShrink: 0, whiteSpace: "normal" }}>Savings Goal target:</span>
              <div className="amount-field big" style={{ flex: 1 }}>
                <span className="dollar">$</span>
                <input
                  className="cell-input num-input"
                  type="number"
                  min="1"
                  step="1000"
                  value={savingsGoal}
                  onChange={(e) => setSavingsGoal(e.target.value === "" ? 1 : money(e.target.value))}
                />
              </div>
          </div>
        </div>

        {/* Right Side: Bar Chart */}
        <div className="balance-block" style={{ display: "flex", flexDirection: "column" }}>
          <div className="projections-chart" style={{ overflowX: "auto", paddingBottom: "10px" }}>
            <div
              className="projections-chart-content"
              style={{
                display: "flex",
                alignItems: "flex-end",
                justifyContent: "center",
                gap: `${CHART_GAP}px`,
                width: "max-content",
                minWidth: "100%",
              }}
            >

            {/* Y Axis */}
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", flexShrink: 0, width: `${AXIS_WIDTH}px` }}>
              <span style={{ height: "19px", marginBottom: "6px" }} />
              <div style={{ height: `${CHART_HEIGHT}px`, width: "100%", display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
                {AXIS_TICKS.map((tick) => (
                  <span
                    key={tick}
                    style={{
                      fontSize: "10px",
                      fontFamily: "'IBM Plex Mono', monospace",
                      color: "var(--ink-soft)",
                      paddingRight: "6px",
                      transform: "translateY(-50%)",
                    }}
                  >
                    {tick}%
                  </span>
                ))}
              </div>
            </div>

            {periods.map((months, index) => {
              const safeMonths = months || 0; 
              const val = currentSavings + (monthlyNet * safeMonths); 
              
              const safeGoal = Math.max(savingsGoal, 1);
              const rawPercent = (val / safeGoal) * 100;
              const percent = Math.min(Math.max(rawPercent, 0), 100); 
              const progressColor = val < 0
                ? "var(--expense-deep)"
                : percent < 25
                ? "var(--progress-low)"
                : percent < 50
                ? "var(--progress-mid)"
                : percent < 75
                ? "var(--progress-high)"
                : "var(--progress-goal)";
              
              return (
                <div key={index} style={{ display: "flex", flexDirection: "column", alignItems: "center", width: "60px", flexShrink: 0 }}>
                  
                  {/* Value Label */}
                  <span style={{ fontWeight: 600, fontSize: "10px", fontFamily: "'IBM Plex Mono', monospace", marginBottom: "6px", textAlign: "center" }}>
                    {fmt(val)}
                  </span>
                  
                  {/* Vertical Bar */}
                  <div
                    className="bar"
                    title={`${percent.toFixed(0)}% of goal filled`}
                    style={{
                      margin: 0,
                      width: "24px",
                      height: `${CHART_HEIGHT}px`,
                      background: "var(--paper-alt)",
                      backgroundImage: "repeating-linear-gradient(to top, var(--rule) 0, var(--rule) 1px, transparent 1px, transparent 25%)",
                      display: "flex",
                      flexDirection: "column",
                      justifyContent: "flex-end",
                      borderRadius: "4px",
                      overflow: "hidden",
                      marginBottom: "10px",
                      cursor: "default",
                    }}
                  >
                     <div 
                       className="bar-seg" 
                       title={`${percent.toFixed(0)}% of goal filled`}
                       style={{ 
                         height: `${percent}%`, 
                         width: "100%",
                         background: progressColor,
                         transition: "height 0.3s ease"
                       }} 
                     />
                  </div>

                  {/* Editable Month Input */}
                  <div style={{ display: "flex", alignItems: "center", gap: "4px", marginBottom: "4px" }}>
                    <input 
                      type="number" 
                      min="1"
                      className="cell-input num-input"
                      style={{ width: "40px", padding: "2px", textAlign: "center", fontSize: "11px" }}
                      value={months}
                      onChange={(e) => handlePeriodChange(index, e.target.value)}
                    />
                    <span style={{ fontSize: "10px", color: "var(--ink-soft)" }}>mo</span>
                  </div>

                  {/* Remove Button */}
                  <button 
                    onClick={() => removePeriod(index)}
                    style={{ background: "transparent", border: "none", color: "var(--expense-deep)", fontSize: "11px", cursor: "pointer", padding: "2px" }}
                  >
                    Remove
                  </button>
                </div>
              );
            })}
            </div>
          </div>

          {/* Add New Milestone Button — offset by the axis width + gap so it
              centers over the bars themselves, not the axis labels beside them. */}
          <div style={{ display: "flex", marginTop: "6px" }}>
            <div style={{ width: `${AXIS_WIDTH + CHART_GAP}px`, flexShrink: 0 }} />
            <div style={{ flex: 1, display: "flex", justifyContent: "center" }}>
              <button 
                onClick={addPeriod}
                style={{ padding: "6px 14px", background: "var(--paper-alt)", border: "1px dashed var(--ink-soft)", borderRadius: "6px", cursor: "pointer", whiteSpace: "nowrap", fontSize: "11px" }}
              >
                + Add Milestone
              </button>
            </div>
          </div>
        </div>

      </div>
    </section>
  );
}

function TransferModal({ open, amount, onAmountChange, onCancel, onConfirm, error, fromAccount, availableAmount }) {
  const inputRef = useRef(null);

  useEffect(() => {
    if (open && inputRef.current) {
      inputRef.current.focus();
    }
  }, [open]);

  useEffect(() => {
    if (!open) return;
    const onKeyDown = (e) => {
      if (e.key === "Escape") onCancel();
      if (e.key === "Enter") onConfirm();
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [open, onCancel, onConfirm]);

  if (!open) return null;

  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal-panel" role="dialog" aria-modal="true" aria-labelledby="transfer-modal-title" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3 id="transfer-modal-title">Transfer</h3>
          <button type="button" className="modal-close" onClick={onCancel} aria-label="Close">
            ×
          </button>
        </div>
        <p className="panel-sub small">
          Move money from {fromAccount === "savings" ? "savings into checking / make-it money" : "checking / make-it money into savings"}.
        </p>

        <div className="amount-field big modal-amount">
          <span className="dollar">$</span>
          <input
            ref={inputRef}
            className="cell-input num-input"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
            value={amount}
            onChange={(e) => onAmountChange(e.target.value)}
          />
        </div>
        <p className="foot-note modal-available">Available in {fromAccount === "savings" ? "savings" : "checking"}: {fmt(availableAmount)}</p>

        {error && <p className="warning modal-error">{error}</p>}

        <div className="modal-actions">
          <button type="button" className="add-btn" onClick={onCancel}>
            Cancel
          </button>
          <button type="button" className="add-btn primary" onClick={onConfirm}>
            Transfer to {fromAccount === "savings" ? "checking" : "savings"}
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [status, setStatus] = useState("loading");
  const [saveState, setSaveState] = useState("idle");
  const saveTimer = useRef(null);
  const hasLoaded = useRef(false);
  const [undoExtraItems, setUndoExtraItems] = useState(null);
  const [undoPaidExtraItems, setUndoPaidExtraItems] = useState(null);
  const [undoSettle, setUndoSettle] = useState(null);
  const [undoMonthlySpent, setUndoMonthlySpent] = useState(null);
  const [transferOpen, setTransferOpen] = useState(false);
  const [transferFrom, setTransferFrom] = useState("savings");
  const [transferAmount, setTransferAmount] = useState("");
  const [transferError, setTransferError] = useState("");

  const [pageTitle, setPageTitle] = useState(() => {
    try {
      return localStorage.getItem(TITLE_KEY) || DEFAULT_TITLE;
    } catch (err) {
      return DEFAULT_TITLE;
    }
  });
  const [editingTitle, setEditingTitle] = useState(false);
  const [titleDraft, setTitleDraft] = useState(pageTitle);

  const commitTitle = (value) => {
    const trimmed = (value || "").trim() || DEFAULT_TITLE;
    setPageTitle(trimmed);
    setTitleDraft(trimmed);
    setEditingTitle(false);
    try {
      localStorage.setItem(TITLE_KEY, trimmed);
    } catch (err) {
      console.error("Title save error:", err);
    }
  };

  const [theme, setTheme] = useState(() => {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") return saved;
    } catch (err) {
      // ignore
    }
    if (typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      return "dark";
    }
    return "light";
  });

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  // As long as the person hasn't explicitly picked a theme, keep following
  // their system setting live (so switching the OS to dark at night updates
  // this page automatically).
  useEffect(() => {
    let hasManualPref = false;
    try {
      hasManualPref = localStorage.getItem(THEME_KEY) !== null;
    } catch (err) {
      // ignore
    }
    if (hasManualPref || typeof window === "undefined" || !window.matchMedia) return;
    const mql = window.matchMedia("(prefers-color-scheme: dark)");
    const handleChange = (e) => setTheme(e.matches ? "dark" : "light");
    if (mql.addEventListener) mql.addEventListener("change", handleChange);
    else mql.addListener(handleChange);
    return () => {
      if (mql.removeEventListener) mql.removeEventListener("change", handleChange);
      else mql.removeListener(handleChange);
    };
  }, []);

  const toggleTheme = () => {
    setTheme((t) => {
      const next = t === "dark" ? "light" : "dark";
      try {
        localStorage.setItem(THEME_KEY, next);
      } catch (err) {
        console.error("Theme save error:", err);
      }
      return next;
    });
  };

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const merged = { ...defaultData(), ...parsed, accounts: { ...defaultData().accounts, ...(parsed.accounts || {}) } };
        merged.monthlySpent = parseFloat(parsed.monthlySpent) || 0;
        merged.monthlySavingsTracker = {
          ...defaultData().monthlySavingsTracker,
          ...(parsed.monthlySavingsTracker || {}),
          activeMonth: /^\d{4}-\d{2}$/.test(parsed.monthlySavingsTracker?.activeMonth || "")
            ? parsed.monthlySavingsTracker.activeMonth
            : monthKeyFromDate(),
          actualIncomeByMonth: Object.fromEntries(
            Object.entries(parsed.monthlySavingsTracker?.actualIncomeByMonth || {})
              .filter(([month, items]) => /^\d{4}-\d{2}$/.test(month) && Array.isArray(items))
              .map(([month, items]) => [
                month,
                items.map((item) => ({
                  id: item.id || genId(),
                  name: item.name || "",
                  amount: money(item.amount),
                })),
              ])
          ),
          history: Array.isArray(parsed.monthlySavingsTracker?.history)
            ? parsed.monthlySavingsTracker.history
                .filter((record) => /^\d{4}-\d{2}$/.test(record?.month || ""))
                .map((record) => ({
                  month: record.month,
                  actualIncome: money(record.actualIncome === undefined ? record.income : record.actualIncome),
                  spent: money(record.spent),
                  actualSaved: money(record.actualSaved === undefined ? record.saved : record.actualSaved),
                }))
            : [],
        };
        // Migration: default to expanded for saves made before the
        // collapsible item calculator existed.
        merged.calculatorOpen = typeof parsed.calculatorOpen === "boolean" ? parsed.calculatorOpen : true;
        merged.transactionsOpen = typeof parsed.transactionsOpen === "boolean" ? parsed.transactionsOpen : true;
        // Migration: keep the stand-alone calculator list separate from any
        // balance-affecting records, including saves made before it existed.
        merged.calculatorItems = Array.isArray(parsed.calculatorItems)
          ? parsed.calculatorItems.map((it) => ({
              ...it,
              direction: it.direction === "add" ? "add" : "subtract",
              dimmed: it.dimmed === undefined ? false : it.dimmed,
            }))
          : [];
        // Migration: monthly items saved before dim/move-tracking existed.
        if (Array.isArray(parsed.monthlyItems)) {
          merged.monthlyItems = parsed.monthlyItems.map((it) => ({
            ...it,
            dimmed: it.dimmed === undefined ? false : it.dimmed,
            dueDay: it.dueDay === undefined ? "" : it.dueDay,
          }));
        }
        // Migration: annual bills saved before due dates / move-tracking existed.
        if (Array.isArray(parsed.annualItems)) {
          merged.annualItems = parsed.annualItems.map((it) => ({
            ...it,
            dueDate: it.dueDate === undefined ? "" : it.dueDate,
            movedThisCycle: it.movedThisCycle === undefined ? false : it.movedThisCycle,
          }));
        }
        // Migration: older one-off entries did not retain a source due date.
        // When a matching bill is currently dimmed/moved, recover its due data
        // so past Move → entries show the same expected date as their source.
        if (Array.isArray(parsed.extraItems)) {
          merged.extraItems = parsed.extraItems.map((it) => {
            const monthlySource = merged.monthlyItems.find(
              (bill) => bill.name === it.name && bill.dimmed && bill.dueDay
            );
            const annualSource = merged.annualItems.find(
              (bill) => bill.name === it.name && bill.movedThisCycle && bill.dueDate
            );
            const dueDay = it.dueDay || monthlySource?.dueDay || "";
            return {
              ...it,
              paid: it.paid === undefined ? true : it.paid,
              dueDay,
              dueDate:
                it.dueDate ||
                (dueDay ? toDateInputValue(nextMonthlyOccurrence(dueDay)) : annualSource?.dueDate || ""),
              // Migration: Received items saved before this was enforced may
              // still be tagged "checking" — force them to savings so old
              // saves match the new behavior.
              account: it.direction === "add" ? "savings" : it.account,
            };
          });
        }
        // Normalize older saves too, so previously-entered long decimals are
        // shown and persisted as currency with at most two decimal places.
        ["monthlyItems", "annualItems", "incomeItems", "extraItems", "calculatorItems"].forEach((listKey) => {
          merged[listKey] = (merged[listKey] || []).map((item) => ({ ...item, amount: money(item.amount) }));
        });
        merged.accounts = {
          checking: money(merged.accounts.checking),
          savings: money(merged.accounts.savings),
        };
        merged.monthlySpent = money(merged.monthlySpent);
        merged.savingsValue = money(merged.savingsValue);
        merged.projections = {
          ...merged.projections,
          surpriseBuffer: money(merged.projections.surpriseBuffer),
          savingsGoal: money(merged.projections.savingsGoal),
        };
        // Migration: fill in any projections fields (surprise buffer, savings
        // goal, milestone periods) missing from data saved before these were
        // persisted, so old saves don't crash on a missing field.
        merged.projections = { ...defaultData().projections, ...(parsed.projections || {}) };
        setData(withEntryOrder(merged));
      } else {
        setData(withEntryOrder(defaultData()));
      }
    } catch (err) {
      console.error("Ledger load error:", err);
      setData(withEntryOrder(defaultData()));
    }
    setStatus("ready");
  }, []);

  useEffect(() => {
    if (!data || status !== "ready") return;
    if (!hasLoaded.current) {
      hasLoaded.current = true;
      return;
    }
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        setSaveState("saved");
      } catch (err) {
        console.error("Ledger save error:", err);
        setSaveState("idle");
      }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [data]);

  const updateItem = (listKey) => (id, patch) => {
    setData((d) => ({
      ...d,
      [listKey]: d[listKey].map((it) => (it.id === id ? { ...it, ...patch } : it)),
    }));
  };
  const addItem = (listKey, shape) => () => {
    setData((d) => ({
      ...d,
      [listKey]: [...d[listKey], { id: genId(), entryOrder: nextEntryOrder(d[listKey]), ...shape }],
    }));
  };

  const reorderItems = (listKey) => (activeId, overId) => {
      if (activeId === overId) return;

      setData(d => {
          const items = [...d[listKey]];

          const oldIndex = items.findIndex(i => i.id === activeId);
          const newIndex = items.findIndex(i => i.id === overId);

          const moved = items.splice(oldIndex, 1)[0];
          items.splice(newIndex, 0, moved);

          return {
              ...d,
              [listKey]: items
          };
      });
  };

  const removeItem = (listKey) => (id) => {

  const removeSelectedItems = (listKey) => (ids) => {

const markExtraItemsPaid = (ids) => {
  if (!ids || ids.length === 0) return;

  const idSet = new Set(ids);

  setData((d) => {
    setUndoPaidExtraItems({
      accounts: d.accounts,
      extraItems: d.extraItems,
      monthlySpent: d.monthlySpent,
    });

    const accounts = { ...d.accounts };
    let monthlySpent = parseFloat(d.monthlySpent) || 0;

    const extraItems = d.extraItems.map((item) => {
      if (!idSet.has(item.id) || item.paid) return item;

      const amount = parseFloat(item.amount) || 0;
      const delta = item.direction === "add" ? amount : -amount;
      const acct = item.direction === "add" ? "savings" : item.account;

      accounts[acct] = money((parseFloat(accounts[acct]) || 0) + delta);
      if (item.direction === "subtract") monthlySpent = money(monthlySpent + amount);

      return {
        ...item,
        paid: true,
      };
    });

    return {
      ...d,
      accounts,
      extraItems,
      monthlySpent,
    };
  });
};

const markExtraItemsUnpaid = (ids) => {
  if (!ids || ids.length === 0) return;

  const idSet = new Set(ids);

  setData((d) => {
    setUndoPaidExtraItems({
      accounts: d.accounts,
      extraItems: d.extraItems,
      monthlySpent: d.monthlySpent,
    });

    const accounts = { ...d.accounts };
    let monthlySpent = parseFloat(d.monthlySpent) || 0;

    const extraItems = d.extraItems.map((item) => {
      if (!idSet.has(item.id) || !item.paid) return item;

      const amount = parseFloat(item.amount) || 0;

      // Reverse whatever Paid previously did
      const delta = item.direction === "add" ? -amount : amount;
      const acct = item.direction === "add" ? "savings" : item.account;

      accounts[acct] = money((parseFloat(accounts[acct]) || 0) + delta);
      if (item.direction === "subtract") monthlySpent = money(Math.max(0, monthlySpent - amount));

      return {
        ...item,
        paid: false,
      };
    });

    return {
      ...d,
      accounts,
      extraItems,
      monthlySpent,
    };
  });
};

// Copies an annual bill into the One-off spending & deposits list as a new
// (unpaid) item, and dims the annual bill so it's clearly "already logged"

const moveAnnualItemToOneOff = (id) => {

    if (!bill || bill.movedThisCycle) return d;

      entryOrder: nextEntryOrder(d.extraItems),
      name: bill.name,
      account: "checking",
      direction: "subtract",

      paid: false,
      dueDate: bill.dueDate || "",
    };
    return {
      ...d,
      annualItems: d.annualItems.map((it) => (it.id === id ? { ...it, movedThisCycle: true } : it)),
      extraItems: [...d.extraItems, newExtraItem],

  });
};

// Commits the displayed running balances: cover a negative checking balance
// from savings when possible, sweep a positive checking balance into savings,
// and reset checking to $0. Paid items remain in the list for manual clearing.
const confirmRunningBalances = () => {
  setData((d) => {
    const paidItems = d.extraItems.filter((i) => i.paid);
    const baseChecking = parseFloat(d.accounts.checking) || 0;
    const baseSavings = parseFloat(d.accounts.savings) || 0;

    let transfer = 0;
    if (baseChecking < 0) {
      transfer = Math.min(-baseChecking, Math.max(baseSavings, 0));
    }
    const currentChecking = baseChecking + transfer;
    const currentSavings = baseSavings - transfer;

    if (currentChecking === 0 && paidItems.length === 0) return d;

    setUndoSettle({ accounts: d.accounts, extraItems: d.extraItems });
    setUndoPaidExtraItems(null);

    return {
      ...d,
      accounts: {
        checking: 0,
        savings: money(currentSavings + Math.max(currentChecking, 0)),
      },
      extraItems: d.extraItems,
    };
  });
};

// Applies only the automatic shortfall coverage. This alternative confirmation
// leaves a positive checking balance in checking instead of sweeping it away.
const confirmCheckingBalance = () => {
  setData((d) => {
    const baseChecking = parseFloat(d.accounts.checking) || 0;
    const baseSavings = parseFloat(d.accounts.savings) || 0;
    const transfer = baseChecking < 0 ? Math.min(-baseChecking, Math.max(baseSavings, 0)) : 0;
    if (transfer === 0) return d;

    setUndoSettle({ accounts: d.accounts, extraItems: d.extraItems });
    setUndoPaidExtraItems(null);
    return {
      ...d,
      accounts: {
        checking: money(baseChecking + transfer),
        savings: money(baseSavings - transfer),
      },
    };
  });
};

  const updateAccount = (key) => (value) => {

            Pending (unchecked) items are just a heads-up list and don't count yet.
          </p>
        </div>

        <div className="balance-inputs">
          <div className="balance-block">
            <span className="field-label">Checking / make-it money balance</span>
            <div className="amount-field big">
              <span className="dollar">$</span>
              <input
                className="cell-input num-input"
                type="number"
                step="0.01"
                value={data.accounts.checking}
                onChange={(e) => updateAccount("checking")(e.target.value === "" ? "" : money(e.target.value))}
              />
            </div>
            <div className="balance-current">
              <span className="summary-label">
                Current balance
              </span>
              <span className={`summary-value ${totals.realChecking < 0 ? "negative" : "income"}`}>
                {fmt(totals.realChecking)}
              </span>
              {totals.transfer > 0 && (
                <span className="transfer-note">↳ {fmt(totals.transfer)} auto-covered from savings</span>
              )}
              {totals.shortfall > 0 && (
                <span className="shortfall-note">
                  Still short {fmt(totals.shortfall)} — savings can't fully cover this
                </span>
              )}
              <div className="settle-row">
                <button type="button" className="add-btn small" onClick={() => openTransfer("checking")}>
                  Transfer to Savings →
                </button>
                <button
                  className="add-btn"
                  onClick={confirmRunningBalances}
                  disabled={(parseFloat(data.accounts.checking) || 0) === 0 && !data.extraItems.some((item) => item.paid)}
                  title="Commit the current running balances, move any positive checking balance to savings, and set checking to $0"
                >
                  Confirm balances &amp; clear
                </button>
                <button
                  className="add-btn"
                  onClick={confirmCheckingBalance}
                  disabled={totals.transfer === 0}
                  title="Commit automatic savings coverage for a negative checking balance without sweeping a positive balance into savings"
                >
                  Confirm checking balance
                </button>
                {undoSettle && (
                  <button className="add-btn" onClick={undoSettleChange}>
                    Undo
                  </button>
                )}
              </div>
            </div>
          </div>

          <div className="balance-block">
            <span className="field-label">Savings / money market balance</span>
            <div className="amount-field big">
              <span className="dollar">$</span>
              <input
                className="cell-input num-input"
                type="number"
                step="0.01"
                value={data.accounts.savings}
                onChange={(e) => updateAccount("savings")(e.target.value === "" ? "" : money(e.target.value))}
              />
            </div>
            <div className="balance-current">
              <div className="running-balance-totals">
                <div>
                  <span className="summary-label">Current running balance</span>
                  <span className={`summary-value ${totals.realSavings < 0 ? "negative" : "savings"}`}>
                    {fmt(totals.realSavings)}
                  </span>
                </div>
                <div>
                  <span className="summary-label">Projected running balance</span>
                  <span className={`summary-value ${totals.projectedRunningSavings < 0 ? "negative" : "savings"}`}>
                    {fmt(totals.projectedRunningSavings)}
                  </span>
                </div>
              </div>
              {totals.transfer > 0 && (
                <span className="transfer-note">↳ sent {fmt(totals.transfer)} to checking to cover the shortfall</span>
              )}
              <div className="settle-row">
                <button type="button" className="add-btn small" onClick={() => openTransfer("savings")}>
                  Transfer to Checking →
                </button>
              </div>
              <div className="monthly-spent-summary">
                <div className="monthly-spent-totals">
                  <div>
                    <span className="summary-label">Spent this month</span>
                    <span className="summary-value negative">{fmt(data.monthlySpent)}</span>
                  </div>
                  <div>
                    <span className="summary-label" title="Total spending of all items in the Transactions & cash flow section">Projected spent this month</span>
                    <span className="summary-value negative">{fmt(totals.projectedActualSpent)}</span>
                    <span className="projected-spend-difference">Diff: {fmt(totals.remainingProjectedSpent)}</span>
                  </div>
                </div>
                <div className="settle-row">
                  <button className="add-btn" onClick={clearMonthlySpent} disabled={(parseFloat(data.monthlySpent) || 0) === 0} title="Save the tracked month, then start the next month at $0 spent">
                    Clear monthly total
                  </button>
                  <button className="add-btn" onClick={undoClearMonthlySpent} disabled={undoMonthlySpent === null}>
                    Undo clear
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div className="transactions-panel-head">
          <h3 className="sub-heading">Transactions &amp; cash flow</h3>
          <button
            type="button"
            className="collapse-toggle"
            onClick={toggleTransactionsOpen}
            aria-expanded={data.transactionsOpen}
            title={data.transactionsOpen ? "Collapse transactions and cash flow" : "Expand transactions and cash flow"}
          >
            <span className={`collapse-arrow ${data.transactionsOpen ? "is-open" : ""}`} aria-hidden="true">▷</span>
            {data.transactionsOpen ? "Collapse" : "Expand"}
          </button>
        </div>
        {data.transactionsOpen && (
          <React.Fragment>
            <p className="panel-sub small">
              Random purchases, surprise bills, bonuses, gifts — anything outside your regular budget. Check
              the box next to one or more items, then click "Paid" to apply them to the balances above.
            </p>
            <ExtraItemsTable
              items={data.extraItems}
              onChange={updateItem("extraItems")}
              onAdd={addItem("extraItems", { name: "", account: "checking", direction: "subtract", dueDay: "", dueDate: "", amount: 0, paid: false })}
              onRemove={removeExtraItem}
              onClearAll={clearExtraItems}
              onUndoClear={undoExtraItemsChange}
              canUndoClear={!!undoExtraItems}
              onMarkPaid={markExtraItemsPaid}
              onMarkUnpaid={markExtraItemsUnpaid}
              onUndoPaid={undoMarkPaid}
              canUndoPaid={!!undoPaidExtraItems}
              onReorder={reorderItems("extraItems")}
            />
          </React.Fragment>
        )}
      </section>

      <MonthlySavingsTracker
        income={totals.income}
        spent={money(data.monthlySpent)}
        projectedSpent={totals.projectedActualSpent}
        tracker={data.monthlySavingsTracker}
        onMonthChange={updateTrackingMonth}
        onAddIncome={addActualIncome}
        onChangeIncome={updateActualIncome}
        onRemoveIncome={removeActualIncome}
      />

      <ItemCalculatorTable
        items={data.calculatorItems}
        onChange={updateItem("calculatorItems")}
        onAdd={addItem("calculatorItems", { name: "", direction: "subtract", amount: 0, dimmed: false })}
        onRemove={removeItem("calculatorItems")}
        onDeleteSelected={removeSelectedItems("calculatorItems")}
        onDimSelected={(ids) => setCalculatorItemsDimmed(ids, true)}
        onUndimSelected={(ids) => setCalculatorItemsDimmed(ids, false)}
        onReorder={reorderItems("calculatorItems")}
        open={data.calculatorOpen}
        onToggleOpen={toggleCalculatorOpen}
      />

      <div className="grid">
        <MonthlyItemsTable
          items={data.monthlyItems}
          onChange={updateItem("monthlyItems")}
          onAdd={addItem("monthlyItems", { name: "", type: "variable", amount: 0, dimmed: false, dueDay: "" })}
          onRemove={removeItem("monthlyItems")}
          onReorder={reorderItems("monthlyItems")}
          onMoveToOneOff={moveMonthlyItemToOneOff}
          onUndim={undimMonthlyItem}
          onUndimSelected={undimMonthlyItems}
          onDimSelected={dimMonthlyItems}
          addLabel="Add monthly item"
          emptyLabel="No monthly items yet — add your first bill or estimate."
          footerNote={
            <div className="flex flex-col">
              <span>{`Fixed ${fmt(totals.fixed)} + Estimated ${fmt(totals.variable)} = ${fmt(totals.monthly)} / mo.`}</span><br/>
              {totals.dimmedMonthlyCount > 0 && (
                <span className="text-sm opacity-80 mt-1">
                  {totals.dimmedMonthlyCount} item{totals.dimmedMonthlyCount === 1 ? "" : "s"} dimmed — excluded from the total above, but still counted in Monthly expenses up top
                </span>
              )}
            </div>
          }
        />

        <AnnualBillsTable
          items={data.annualItems}
          onChange={updateItem("annualItems")}
          onAdd={addItem("annualItems", { name: "", amount: 0, dueDate: "", movedThisCycle: false })}
          onRemove={removeItem("annualItems")}
          onReorder={reorderItems("annualItems")}
          onMoveToOneOff={moveAnnualItemToOneOff}
          onUndim={undimAnnualItem}
          onUndimSelected={undimAnnualItems}
          onDimSelected={dimAnnualItems}
          addLabel="Add annual bill"
          emptyLabel="No annual bills yet — add propane, Ring, garbage, phone, etc."
          footerNote={
            <div className="flex flex-col">
              <span>{`${fmt(totals.annual)} / yr → ${fmt(totals.annualMonthly)} / mo`}</span><br/>
              <span className="text-sm opacity-80 mt-1">
                Savings remaining: {fmt(totals.realSavings - totals.annual)}
              </span>
            </div>
          }
        />

        <LineItemTable
          title="Income"
          subtitle="Average monthly take-home pay per person or paycheck."
          items={data.incomeItems}
          onChange={updateItem("incomeItems")}
          onAdd={addItem("incomeItems", { name: "", amount: 0 })}
          onRemove={removeItem("incomeItems")}
          onReorder={reorderItems("incomeItems")}
          showType={false}
          addLabel="Add income source"
          emptyLabel="Add your paycheck and your partner's paycheck."
          footerNote={`Total ${fmt(totals.income)} / mo`}
        />

        <section className="ledger-panel savings-panel">
          <div className="panel-head">
            <h2>Savings target</h2>
            <p className="panel-sub">Decide how much of your income goes to savings before the rest becomes "make-it" money.</p>
          </div>

          <div className="savings-controls">
            <div className="type-toggle wide">
              <button
                type="button"
                className={data.savingsMode === "percent" ? "active" : ""}
                onClick={() => setData((d) => ({ ...d, savingsMode: "percent" }))}
              >
                % of income
              </button>
              <button
                type="button"
                className={data.savingsMode === "fixed" ? "active" : ""}
                onClick={() => setData((d) => ({ ...d, savingsMode: "fixed" }))}
              >
                Fixed $ / mo
              </button>
            </div>

            <div className="amount-field big">
              {data.savingsMode === "fixed" && <span className="dollar">$</span>}
              <input
                className="cell-input num-input"
                type="number"
                min="0"
                step={data.savingsMode === "percent" ? "1" : "0.01"}
                value={data.savingsValue}
                onChange={(e) =>
                  setData((d) => ({
                    ...d,
                    savingsValue: e.target.value === "" ? "" : money(e.target.value),
                  }))
                }
              />
              {data.savingsMode === "percent" && <span className="percent">%</span>}
            </div>
          </div>

          <div className="savings-summary">
            <div>
              <span className="summary-label">Goes to savings</span>
              <span className="summary-value savings">{fmt(totals.savings)} / mo</span>
            </div>
            <div>
              <span className="summary-label">Left over to spend freely</span>
              <span className={`summary-value ${totals.makeIt < 0 ? "negative" : "income"}`}>
                {fmt(totals.makeIt)} / mo
              </span>
            </div>
          </div>
          {totals.makeIt < 0 && (
            <p className="warning">
              You're spending more than you bring in at this savings rate. Try lowering the savings
              target or trimming a monthly item.
            </p>
          )}
        </section>
      </div>

      <ProjectionsPanel 
        income={totals.income} 
        monthlyExpenses={totals.allMonthly} 
        currentSavings={totals.realSavings} 
        projections={data.projections}
        onProjectionsChange={updateProjections}
      />

      <footer className="ledger-footer">
        Figures are stored privately and only visible to you. Annual bills are automatically divided by
        12, and real balances combine your entered starting balance with the transactions you log.
      </footer>

      <TransferModal
        open={transferOpen}
        amount={transferAmount}
        onAmountChange={setTransferAmount}
        onCancel={closeTransfer}
        onConfirm={submitTransfer}
        error={transferError}
        fromAccount={transferFrom}
        availableAmount={parseFloat(data.accounts[transferFrom]) || 0}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
