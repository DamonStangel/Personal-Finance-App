<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Household Ledger</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
  html, body { margin: 0; padding: 0; background: var(--paper); }

  :root {
    --paper: #EDF1EC;
    --paper-alt: #E1E8E0;
    --surface: #FBFCFA;
    --ink: #17241F;
    --ink-soft: #4E5D57;
    --rule: #C7D1C6;
    --income: #2F6F5E;
    --expense: #7A3B4E;
    --expense-soft: #A8687C;
    --expense-deep: #58283A;
    --savings: #96702F;
  }

  html[data-theme="dark"] {
    --paper: #14181A;
    --paper-alt: #1D2325;
    --surface: #1B2124;
    --ink: #E7ECE9;
    --ink-soft: #93A29B;
    --rule: #313B3D;
    --income: #6FBF9E;
    --expense: #E28FA3;
    --expense-soft: #C97690;
    --expense-deep: #F4AFC2;
    --savings: #E0B15E;
  }

  html[data-theme="dark"] .warning {
    background: #3A2530;
  }

  * { box-sizing: border-box; }

  .ledger-root {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 32px clamp(16px, 4vw, 48px) 48px;
    min-height: 100%;
    max-width: 1600px;
    margin: 0 auto;
  }

  .loading-state {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    padding: 64px 0;
    text-align: center;
  }

  .masthead { position: relative; margin-bottom: 28px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
  .masthead-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
  }
  .masthead-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .masthead h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: clamp(22px, 3.4vw, 32px);
    margin: 0;
    line-height: 1.2;
    max-width: 640px;
  }
  .masthead h1.editable-title {
    cursor: pointer;
    border-radius: 4px;
    padding: 2px 6px;
    margin-left: -6px;
    transition: background 0.15s ease;
  }
  .masthead h1.editable-title:hover {
    background: var(--paper-alt);
  }
  .masthead-title-input {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: clamp(22px, 3.4vw, 32px);
    line-height: 1.2;
    max-width: 640px;
    width: 100%;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--income);
    border-radius: 4px;
    padding: 2px 6px;
    margin: 0 0 0 -7px;
  }
  .masthead-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  @media (max-width: 640px) {
    .masthead-meta { align-items: flex-start; }
  }
  .save-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 4px 10px;
    border-radius: 100px;
  }
  .save-pill.saved { color: var(--income); border-color: var(--income); }

  .theme-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 100px;
    padding: 5px 10px;
    color: var(--ink);
    cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--ink); }

  .clock-chip {
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
    line-height: 1.5;
  }
  @media (max-width: 640px) { .clock-chip { text-align: left; } }
  .clock-date {
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .clock-time {
    font-size: 18px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .weather-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 100px;
    padding: 5px 12px 5px 10px;
  }
  .weather-chip .weather-icon { font-size: 16px; line-height: 1; }
  .weather-chip .weather-temp { font-weight: 600; color: var(--ink); font-size: 13px; }
  .weather-chip button {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  .strip {
    display: flex;
    align-items: stretch;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 18px clamp(10px, 2.5vw, 22px);
    margin-bottom: 6px;
    position: relative;
    overflow: hidden;
    flex-wrap: wrap;
  }
  .strip::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background-image: radial-gradient(circle at 6px 0, transparent 5px, var(--paper) 6px);
    background-size: 12px 6px;
    background-repeat: repeat-x;
  }
  .strip-item { display: flex; flex-direction: column; gap: 4px; min-width: 108px; }
  .strip-final { padding-left: 6px; }
  .strip-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .strip-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(18px, 2.6vw, 24px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .strip-value.income { color: var(--income); }
  .strip-value.expense { color: var(--expense); }
  .strip-value.savings { color: var(--savings); }
  .strip-value.negative { color: var(--expense-deep); }
  .strip-op {
    align-self: center;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    font-size: 20px;
  }

  .bar {
    display: flex;
    height: 10px;
    border-radius: 100px;
    overflow: hidden;
    background: var(--paper-alt);
    margin: 14px 2px 8px;
  }
  .bar-seg { height: 100%; transition: width 0.3s ease; }
  .bar-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 30px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-item i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
  }

  .ledger-panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 20px 20px 16px;
    display: flex;
    flex-direction: column;
    margin-bottom: 22px;
  }
  .wide-panel { margin-bottom: 22px; }
  .grid .ledger-panel { margin-bottom: 0; }

  .panel-head h2 {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    margin: 0 0 4px;
  }
  .panel-sub { margin: 0 0 16px; font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
  .panel-sub.small { margin-top: -8px; }
  .sub-heading {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    margin: 18px 0 2px;
    border-top: 1px solid var(--rule);
    padding-top: 16px;
  }

  .balance-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 8px;
  }
  @media (max-width: 640px) {
    .balance-inputs { grid-template-columns: 1fr; }
  }
  .balance-block {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .field-label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .balance-current {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }
  .transfer-note {
    display: block;
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--savings);
  }
  .shortfall-note {
    display: block;
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--expense-deep);
  }

  .table-wrap { display: flex; flex-direction: column; }
.row {
  display: grid;
  grid-template-columns: 20px 1fr 108px 26px;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--rule);
}
  .row.dragging {
    opacity: 0.4;
  }
  .row.drag-over-target {
    box-shadow: inset 0 2px 0 var(--ink);
  }
.row.with-type { 
  grid-template-columns: 20px 1fr 140px 108px 26px;
}
.row.extra-row { 
  grid-template-columns: 20px 20px 1fr 110px 130px 108px 26px;
}
.row.annual-row {
  grid-template-columns: 20px 20px 1fr 128px 108px 84px 26px;
}
.row.monthly-row {
  grid-template-columns: 20px 20px 1fr 140px 92px 108px 84px 26px;
}

.drag-handle {
  cursor: grab;
  color: var(--rule);
  font-size: 14px;
  font-weight: bold;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: -1px;
}
.drag-handle:active {
  cursor: grabbing;
  color: var(--ink-soft);
}
  @media (max-width: 640px) {
    .row.extra-row { grid-template-columns: 1fr; row-gap: 6px; padding-bottom: 12px; }
    .row.annual-row { grid-template-columns: 1fr; row-gap: 6px; padding-bottom: 12px; }
    .row.monthly-row { grid-template-columns: 1fr; row-gap: 6px; padding-bottom: 12px; }
  }
  .row-head {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--ink-soft);
    padding-bottom: 8px;
  }
  .row-head .num { text-align: right; }
  .empty-row { padding: 14px 0; font-size: 13px; color: var(--ink-soft); font-style: italic; }

  .cell-input {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    padding: 4px 2px;
    width: 100%;
    outline: none;
  }
  .cell-input:focus { border-bottom-color: var(--ink-soft); }
  .num-input {
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .amount-field { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
  .amount-field .dollar { font-family: 'IBM Plex Mono', monospace; color: var(--ink-soft); font-size: 13px; }
  .amount-field.big { justify-content: flex-start; }

  .mini-select {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 100px;
    padding: 5px 8px;
    outline: none;
    width: 100%;
  }

  .type-toggle {
    display: flex;
    border: 1px solid var(--rule);
    border-radius: 100px;
    overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }
  .type-toggle button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    padding: 5px 8px;
    cursor: pointer;
  }
  .type-toggle button.active { background: var(--ink); color: var(--paper); }
  .type-toggle.wide { max-width: 260px; margin-bottom: 12px; font-size: 12px; }
  .type-toggle.wide button { padding: 8px 10px; }

  .row-remove {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
  }
  .row-remove:hover { color: var(--expense); }

  .row-select {
    width: 15px;
    height: 15px;
    cursor: pointer;
    accent-color: var(--ink);
  }
  .row-select:disabled { cursor: not-allowed; opacity: 0.4; }

  .row.paid {
    background: var(--paper-alt);
    opacity: 0.6;
  }
  .row.paid .num-input,
  .row.paid .amount-field .dollar {
    text-decoration: line-through;
  }
  .paid-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  .settle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .row.dimmed {
    background: var(--paper-alt);
    opacity: 0.55;
  }
  .date-cell {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .date-input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .due-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }
  .due-badge.soon { color: var(--savings); font-weight: 600; }
  .due-badge.overdue { color: var(--expense-deep); font-weight: 600; }
  .due-badge.estimate { font-style: italic; }

  .due-day-cell { display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .due-day-field { display: flex; align-items: baseline; gap: 3px; justify-content: center; }
  .due-day-field .due-day-prefix { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
  .due-day-input {
    width: 40px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .upcoming-bills { display: flex; flex-direction: column; gap: 0; }
  .upcoming-bill-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 13px;
  }
  .upcoming-bill-row:last-child { border-bottom: none; }
  .upcoming-bill-name { display: flex; flex-direction: column; }
  .upcoming-bill-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .upcoming-bill-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }

  .add-btn.small {
    padding: 4px 8px;
    font-size: 10px;
    white-space: nowrap;
  }

  .panel-foot {
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .add-btn {
      border: 1px dashed var(--ink-soft);
      background: transparent;
      color: var(--ink-soft);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }
    .add-btn:hover { border-color: var(--ink); color: var(--ink); }
    .add-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
  }

  .add-btn:disabled:hover {
      border-color: var(--ink-soft);
      color: var(--ink-soft);
  }

  .add-btn.danger {
      border-style: solid;
      border-color: var(--expense-soft);
      color: var(--expense);
  }

  .add-btn.danger:hover {
      border-color: var(--expense);
  }
  .foot-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .savings-panel .amount-field.big .num-input { font-size: 22px; max-width: 120px; }
  .savings-controls { display: flex; flex-direction: column; gap: 4px; }
  .percent { font-family: 'IBM Plex Mono', monospace; color: var(--ink-soft); font-size: 18px; }

  .balance-block .amount-field.big .num-input { font-size: 20px; max-width: 160px; }

  .savings-summary, .balance-current {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .savings-summary { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .summary-label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .summary-value {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .summary-value.income { color: var(--income); }
  .summary-value.savings { color: var(--savings); }
  .summary-value.negative { color: var(--expense-deep); }

  .warning {
    margin-top: 14px;
    font-size: 13px;
    color: var(--expense-deep);
    background: #F3E4E8;
    border: 1px solid var(--expense-soft);
    border-radius: 6px;
    padding: 10px 12px;
    line-height: 1.4;
  }

  .ledger-footer {
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
  }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    opacity: 0.4;
  }

</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const STORAGE_KEY = "household-ledger-v1";
const TITLE_KEY = "household-ledger-title-v1";
const THEME_KEY = "household-ledger-theme-v1";
const DEFAULT_TITLE = "Personal Finances";

const genId = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

const defaultData = () => ({
  monthlyItems: [
    { id: genId(), name: "Mortgage / Rent", type: "fixed", amount: 1800, dimmed: false, dueDay: 3 },
    { id: genId(), name: "Car payment", type: "fixed", amount: 420, dimmed: false, dueDay: 2 },
    { id: genId(), name: "Netflix", type: "fixed", amount: 17.99, dimmed: false, dueDay: 14 },
    { id: genId(), name: "Spotify", type: "fixed", amount: 11.99, dimmed: false, dueDay: 20 },
    { id: genId(), name: "Groceries", type: "variable", amount: 650, dimmed: false, dueDay: "" },
    { id: genId(), name: "Gas (both cars)", type: "variable", amount: 220, dimmed: false, dueDay: "" },
    { id: genId(), name: "Dog food & supplies", type: "variable", amount: 90, dimmed: false, dueDay: "" },
  ],
  annualItems: [
    { id: genId(), name: "Propane tank lease", amount: 240, dueDate: "2026-10-01", movedThisCycle: false },
    { id: genId(), name: "Ring subscription", amount: 40, dueDate: "2026-08-05", movedThisCycle: false },
    { id: genId(), name: "Garbage disposal service", amount: 300, dueDate: "2027-01-15", movedThisCycle: false },
    { id: genId(), name: "Phone bill (annual)", amount: 960, dueDate: "2026-09-01", movedThisCycle: false },
  ],
  incomeItems: [
    { id: genId(), name: "My take-home pay", amount: 4200 },
    { id: genId(), name: "Wife's take-home pay", amount: 4200 },
  ],
  savingsMode: "percent",
  savingsValue: 15,
  accounts: {
    checking: 2500,
    savings: 12000,
  },
  extraItems: [
    { id: genId(), name: "Car repair", account: "checking", direction: "subtract", amount: 350, paid: true },
    { id: genId(), name: "Tax refund", account: "savings", direction: "add", amount: 800, paid: true },
    { id: genId(), name: "Vet visit (pending)", account: "checking", direction: "subtract", amount: 120, paid: false },
  ],
});

const fmt = (n) =>
  (Number.isFinite(n) ? n : 0).toLocaleString("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });

const sum = (arr) => arr.reduce((acc, it) => acc + (parseFloat(it.amount) || 0), 0);

const signedTotal = (items, account) =>
  items
    .filter((i) => i.account === account)
    .reduce((acc, i) => {
      const amt = parseFloat(i.amount) || 0;
      return acc + (i.direction === "add" ? amt : -amt);
    }, 0);

    function useSortableList(onReorder) {
      const [draggingId, setDraggingId] = useState(null);
      const [overId, setOverId] = useState(null);

      const startDrag = useCallback((id) => {
        setDraggingId(id);
      }, []);

      // Only updates which row is currently highlighted as the drop target.
      // Does NOT reorder the underlying data — that happens once, on drop.
      const dragOverRow = useCallback((id) => {
        setOverId((prev) => (prev === id ? prev : id));
      }, []);

      const dropOnRow = useCallback(
        (id) => {
          setDraggingId((current) => {
            if (current && current !== id) {
              onReorder(current, id);
            }
            return null;
          });
          setOverId(null);
        },
        [onReorder]
      );

      const endDrag = useCallback(() => {
        setDraggingId(null);
        setOverId(null);
      }, []);

      return { draggingId, overId, startDrag, dragOverRow, dropOnRow, endDrag };
    }

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(dateStr + "T00:00:00");
  if (isNaN(due.getTime())) return null;
  return Math.round((due - today) / 86400000);
}

// Given a recurring day-of-month (1-31), finds the next calendar date it falls
// on from today, clamping to the last day of a month when it's too short
// (e.g. a "31st" bill lands on Feb 28/29 that month).
function nextMonthlyOccurrence(day) {
  const d = parseInt(day, 10);
  if (!d || d < 1 || d > 31) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const clampToMonth = (year, month) => {
    const lastDay = new Date(year, month + 1, 0).getDate();
    return new Date(year, month, Math.min(d, lastDay));
  };
  let candidate = clampToMonth(today.getFullYear(), today.getMonth());
  if (candidate < today) {
    candidate = clampToMonth(today.getFullYear(), today.getMonth() + 1);
  }
  return candidate;
}

function daysUntilMonthly(day) {
  const due = nextMonthlyOccurrence(day);
  if (!due) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((due - today) / 86400000);
}

              title='Select, then use "Dim selected" or "Undim selected" below'
            />

            <input
              className="cell-input name-input"
              type="text"
              value={item.name}
              placeholder="Item name"
              ref={(el) => {
                if (el) nameInputRefs.current[item.id] = el;
                else delete nameInputRefs.current[item.id];
              }}
              onChange={(e) => onChange(item.id, { name: e.target.value })}
            />

            <div className="type-toggle">
              <button
                type="button"
                className={item.type === "fixed" ? "active" : ""}
                onClick={() => onChange(item.id, { type: "fixed" })}
              >
                Fixed
              </button>
              <button
                type="button"
                className={item.type === "variable" ? "active" : ""}
                onClick={() => onChange(item.id, { type: "variable" })}
              >
                Estimate
              </button>
            </div>

            <div className="due-day-cell">
              <div className="due-day-field">
                <span className="due-day-prefix">on</span>
                <input
                  className="cell-input num-input due-day-input"
                  type="number"
                  min="1"
                  max="31"
                  placeholder="—"
                  title={item.type === "fixed" ? "Day of the month this is normally due" : "Day of the month you usually spend this (optional, a guess)"}
                  value={item.dueDay === undefined ? "" : item.dueDay}
                  onChange={(e) =>
                    onChange(item.id, {
                      dueDay:
                        e.target.value === ""
                          ? ""
                          : Math.max(1, Math.min(31, parseInt(e.target.value, 10) || 1)),
                    })
                  }
                />
              </div>
              {item.dueDay && !item.dimmed && (() => {
                const remaining = daysUntilMonthly(item.dueDay);
                if (remaining === null) return null;
                return (
                  <span className={`due-badge ${item.type === "variable" ? "estimate" : remaining <= 3 ? "soon" : ""}`}>
                    {remaining === 0 ? "Due today" : `in ${remaining}d`}
                  </span>
                );
              })()}
            </div>

            <div className="amount-field">
              <span className="dollar">$</span>
              <input
                className="cell-input num-input"
                type="number"
                step="0.01"
                min="0"
                inputMode="decimal"
                value={item.amount}
                onChange={(e) =>
                  onChange(item.id, { amount: e.target.value === "" ? "" : parseFloat(e.target.value) })
                }
              />
            </div>

            {item.dimmed ? (
              <button className="add-btn small" onClick={() => onUndim(item.id)}>
                Undim
              </button>
            ) : (
              <button className="add-btn small" onClick={() => onMoveToOneOff(item.id)}>
                Move →
              </button>
            )}

            <button className="row-remove" onClick={() => onRemove(item.id)} aria-label={`Remove ${item.name}`}>
              ×
            </button>
          </div>
        ))}
      </div>

      <div className="panel-foot">
        <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
          <button className="add-btn" onClick={onAdd}>
            + {addLabel}
          </button>
          <button
            className="add-btn"
            onClick={handleDimSelected}
            disabled={selectedIds.size === 0}
          >
            Dim selected{selectedIds.size > 0 ? ` (${selectedIds.size})` : ""}
          </button>
          <button className="add-btn" onClick={handleUndimSelected} disabled={selectedIds.size === 0}>
            Undim selected{selectedIds.size > 0 ? ` (${selectedIds.size})` : ""}
          </button>
        </div>
        {footerNote && <span className="foot-note">{footerNote}</span>}
      </div>
    </section>
  );
}

function LiveClock() {
  const [now, setNow] = useState(() => new Date());

  useEffect(() => {
    const timer = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(timer);
  }, []);

  const dateStr = now.toLocaleDateString("en-US", {
    weekday: "long",
    month: "long",
    day: "numeric",
    year: "numeric",
  });
  const timeStr = now.toLocaleTimeString("en-US", {
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit",
  });

  return (
    <div className="clock-chip">
      <div className="clock-date">{dateStr}</div>
      <div className="clock-time">{timeStr}</div>
    </div>
  );
}

  3: ["☁️", "Overcast"],

  61: ["🌧️", "Light rain"],
  63: ["🌧️", "Rain"],
  65: ["🌧️", "Heavy rain"],
  71: ["🌨️", "Light snow"],

function WeatherWidget() {
  // idle -> asking -> ok | denied | error
  const [state, setState] = useState("idle");
  const [weather, setWeather] = useState(null);

  const fetchWeather = useCallback(() => {
    if (!("geolocation" in navigator)) {
      setState("error");
      return;
    }
    setState("asking");
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          const { latitude, longitude } = pos.coords;
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;
          const res = await fetch(url);
          const json = await res.json();
          const temp = json?.current?.temperature_2m;
          const code = json?.current?.weather_code;
          if (temp === undefined) throw new Error("No temperature in response");
          setWeather({ temp: Math.round(temp), code });
          setState("ok");
        } catch (err) {
          console.error("Weather fetch error:", err);
          setState("error");
        }
      },
      (err) => {
        console.warn("Geolocation denied/unavailable:", err);
        setState("denied");
      },
      { timeout: 8000 }
    );
  }, []);

  useEffect(() => {
    fetchWeather();
  }, [fetchWeather]);

  if (state === "idle" || state === "asking") {
    return (
      <div className="weather-chip">
        <span className="weather-icon">⋯</span> Checking weather…
      </div>
    );
  }

  if (state === "denied" || state === "error") {
    return (
      <div className="weather-chip">
        <span className="weather-icon">🌡️</span>
        <span>Weather unavailable</span>
        <button onClick={fetchWeather}>Retry</button>
      </div>
    );
  }

  const [icon, label] = WEATHER_CODES[weather.code] || ["🌡️", "—"];

  return (
    <div className="weather-chip" title={label}>
      <span className="weather-icon">{icon}</span>
      <span className="weather-temp">{weather.temp}°F</span>
      <span>{label}</span>
    </div>
  );
}

// Merges recurring fixed/estimated monthly items (by day-of-month) with
// one-time annual bills (by exact date) into a single, soonest-first
// reminder list.
function UpcomingBillsPanel({ monthlyItems, annualItems }) {
  const upcoming = useMemo(() => {
    const fromMonthly = monthlyItems
      .filter((it) => !it.dimmed && it.dueDay)
      .map((it) => ({
        id: it.id,
        name: it.name,
        amount: it.amount,
        remaining: daysUntilMonthly(it.dueDay),
        tag: it.type === "fixed" ? "Monthly" : "Monthly · estimate",
      }));

  const fromAnnual = annualItems
    .filter((it) => !it.movedThisCycle && it.dueDate)
    .map((it) => ({
      id: it.id,
      name: it.name,
      amount: it.amount,
      remaining: daysUntil(it.dueDate),
      tag: "Annual",
    }))
    .filter((it) => it.remaining !== null && it.remaining <= 60);

    return [...fromMonthly, ...fromAnnual]
      .filter((it) => it.remaining !== null)
      .sort((a, b) => a.remaining - b.remaining)
      .slice(0, 8);
  }, [monthlyItems, annualItems]);

  if (upcoming.length === 0) return null;

  return (
    <section className="ledger-panel wide-panel">
      <div className="panel-head">
        <h2>Bills due soon</h2>
        <p className="panel-sub">
          Pulled automatically from the due days you set on monthly items and the due dates on annual
          bills below — soonest first.
        </p>
      </div>
      <div className="upcoming-bills">
        {upcoming.map((it) => (
          <div key={it.id} className="upcoming-bill-row">
            <div className="upcoming-bill-name">
              <span>{it.name}</span>
              <span className="upcoming-bill-tag">{it.tag}</span>
            </div>
            <span className="upcoming-bill-amount">{fmt(it.amount)}</span>
            <span className={`due-badge ${it.remaining < 0 ? "overdue" : it.remaining <= 3 ? "soon" : ""}`}>
              {it.remaining < 0
                ? `${Math.abs(it.remaining)}d overdue`
                : it.remaining === 0
                ? "Due today"
                : `in ${it.remaining}d`}
            </span>
          </div>
        ))}
      </div>
    </section>
  );
}

  const monthlyNet = income - monthlyExpenses - surpriseBuffer;

  // 2. Handlers to update, add, or remove custom month intervals
  const handlePeriodChange = (index, newValue) => {
    const updated = [...periods];
    updated[index] = newValue === "" ? "" : parseInt(newValue, 10);
    setPeriods(updated);
  };

  const addPeriod = () => {
    // Default a new period to 24 months
    setPeriods([...periods, 24]);
  };

      </div>
    </section>
  );

function App() {
  const [data, setData] = useState(null);
  const [status, setStatus] = useState("loading");
  const [saveState, setSaveState] = useState("idle");
  const saveTimer = useRef(null);
  const hasLoaded = useRef(false);
  const [undoExtraItems, setUndoExtraItems] = useState(null);
  const [undoPaidExtraItems, setUndoPaidExtraItems] = useState(null);
  const [undoSettle, setUndoSettle] = useState(null);

  const [pageTitle, setPageTitle] = useState(() => {
    try {
      return localStorage.getItem(TITLE_KEY) || DEFAULT_TITLE;
    } catch (err) {
      return DEFAULT_TITLE;
    }
  });
  const [editingTitle, setEditingTitle] = useState(false);
  const [titleDraft, setTitleDraft] = useState(pageTitle);

  const commitTitle = (value) => {
    const trimmed = (value || "").trim() || DEFAULT_TITLE;
    setPageTitle(trimmed);
    setTitleDraft(trimmed);
    setEditingTitle(false);
    try {
      localStorage.setItem(TITLE_KEY, trimmed);
    } catch (err) {
      console.error("Title save error:", err);
    }
  };

  const [theme, setTheme] = useState(() => {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") return saved;
    } catch (err) {
      // ignore
    }
    if (typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      return "dark";
    }
    return "light";
  });

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  // As long as the person hasn't explicitly picked a theme, keep following
  // their system setting live (so switching the OS to dark at night updates
  // this page automatically).
  useEffect(() => {
    let hasManualPref = false;
    try {
      hasManualPref = localStorage.getItem(THEME_KEY) !== null;
    } catch (err) {
      // ignore
    }
    if (hasManualPref || typeof window === "undefined" || !window.matchMedia) return;
    const mql = window.matchMedia("(prefers-color-scheme: dark)");
    const handleChange = (e) => setTheme(e.matches ? "dark" : "light");
    if (mql.addEventListener) mql.addEventListener("change", handleChange);
    else mql.addListener(handleChange);
    return () => {
      if (mql.removeEventListener) mql.removeEventListener("change", handleChange);
      else mql.removeListener(handleChange);
    };
  }, []);

  const toggleTheme = () => {
    setTheme((t) => {
      const next = t === "dark" ? "light" : "dark";
      try {
        localStorage.setItem(THEME_KEY, next);
      } catch (err) {
        console.error("Theme save error:", err);
      }
      return next;
    });
  };

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const merged = { ...defaultData(), ...parsed, accounts: { ...defaultData().accounts, ...(parsed.accounts || {}) } };
        // Migration: items saved before the "paid" feature existed have no `paid`
        // field. Treat those as already applied (paid: true) so previously-entered
        // real balances don't silently change. Only brand-new items default to pending.
        if (Array.isArray(parsed.extraItems)) {
          merged.extraItems = parsed.extraItems.map((it) => ({
            ...it,
            paid: it.paid === undefined ? true : it.paid,
          }));
        }
        // Migration: monthly items saved before dim/move-tracking existed.
        if (Array.isArray(parsed.monthlyItems)) {
          merged.monthlyItems = parsed.monthlyItems.map((it) => ({
            ...it,
            dimmed: it.dimmed === undefined ? false : it.dimmed,
            dueDay: it.dueDay === undefined ? "" : it.dueDay,
          }));
        }
        // Migration: annual bills saved before due dates / move-tracking existed.
        if (Array.isArray(parsed.annualItems)) {
          merged.annualItems = parsed.annualItems.map((it) => ({
            ...it,
            dueDate: it.dueDate === undefined ? "" : it.dueDate,
            movedThisCycle: it.movedThisCycle === undefined ? false : it.movedThisCycle,
          }));
        }
        setData(merged);
      } else {
        setData(defaultData());
      }
    } catch (err) {
      console.error("Ledger load error:", err);
      setData(defaultData());
    }
    setStatus("ready");
  }, []);

  useEffect(() => {
    if (!data || status !== "ready") return;
    if (!hasLoaded.current) {
      hasLoaded.current = true;
      return;
    }
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        setSaveState("saved");
      } catch (err) {
        console.error("Ledger save error:", err);
        setSaveState("idle");
      }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [data]);

  const updateItem = (listKey) => (id, patch) => {
    setData((d) => ({
      ...d,
      [listKey]: d[listKey].map((it) => (it.id === id ? { ...it, ...patch } : it)),
    }));
  };
  const addItem = (listKey, shape) => () => {
    setData((d) => ({ ...d, [listKey]: [...d[listKey], { id: genId(), ...shape }] }));
  };

  const reorderItems = (listKey) => (activeId, overId) => {
      if (activeId === overId) return;

      setData(d => {
          const items = [...d[listKey]];

          const oldIndex = items.findIndex(i => i.id === activeId);
          const newIndex = items.findIndex(i => i.id === overId);

          const moved = items.splice(oldIndex, 1)[0];
          items.splice(newIndex, 0, moved);

          return {
              ...d,
              [listKey]: items
          };
      });
  };

  const removeItem = (listKey) => (id) => {
    setData((d) => ({ ...d, [listKey]: d[listKey].filter((it) => it.id !== id) }));
  };
  const removeExtraItem = (id) => {
    setData((d) => {
    setUndoExtraItems(d.extraItems);

    return {
      ...d,
      extraItems: d.extraItems.filter((it) => it.id !== id),
    };
  });
};

const clearExtraItems = () => {
  setData((d) => {
    if (d.extraItems.length === 0) return d;

    setUndoExtraItems(d.extraItems);

    return {
      ...d,
      extraItems: [],
    };
  });
};

const undoExtraItemsChange = () => {
  if (!undoExtraItems) return;

  setData((d) => ({
    ...d,
    extraItems: undoExtraItems,
  }));

  setUndoExtraItems(null);
};

const markExtraItemsPaid = (ids) => {
  if (!ids || ids.length === 0) return;

  const idSet = new Set(ids);

  setData((d) => {
    setUndoPaidExtraItems({
      accounts: d.accounts,
      extraItems: d.extraItems,
    });

    const accounts = { ...d.accounts };

    const extraItems = d.extraItems.map((item) => {
      if (!idSet.has(item.id) || item.paid) return item;

      const amount = parseFloat(item.amount) || 0;
      const delta = item.direction === "add" ? amount : -amount;

      accounts[item.account] =
        (parseFloat(accounts[item.account]) || 0) + delta;

      return {
        ...item,
        paid: true,
      };
    });

    return {
      ...d,
      accounts,
      extraItems,
    };
  });
};

const markExtraItemsUnpaid = (ids) => {
  if (!ids || ids.length === 0) return;

  const idSet = new Set(ids);

  setData((d) => {
    setUndoPaidExtraItems({
      accounts: d.accounts,
      extraItems: d.extraItems,
    });

    const accounts = { ...d.accounts };

    const extraItems = d.extraItems.map((item) => {
      if (!idSet.has(item.id) || !item.paid) return item;

      const amount = parseFloat(item.amount) || 0;

      // Reverse whatever Paid previously did
      const delta = item.direction === "add" ? -amount : amount;

      accounts[item.account] =
        (parseFloat(accounts[item.account]) || 0) + delta;

      return {
        ...item,
        paid: false,
      };
    });

    return {
      ...d,
      accounts,
      extraItems,
    };
  });
};

const undoMarkPaid = () => {
  if (!undoPaidExtraItems) return;

  setData((d) => ({
    ...d,
    accounts: undoPaidExtraItems.accounts,
    extraItems: undoPaidExtraItems.extraItems,
  }));

  setUndoPaidExtraItems(null);
};

// Copies an annual bill into the One-off spending & deposits list as a new
// (unpaid) item, and dims the annual bill so it's clearly "already logged"
// for this cycle — without deleting it, so it's ready to reuse next year.
const moveAnnualItemToOneOff = (id) => {
  setData((d) => {
    const bill = d.annualItems.find((it) => it.id === id);
    if (!bill || bill.movedThisCycle) return d;
    const newExtraItem = {
      id: genId(),
      name: bill.name,
      account: "checking",
      direction: "subtract",
      amount: bill.amount,
      paid: false,
    };
    return {
      ...d,
      annualItems: d.annualItems.map((it) => (it.id === id ? { ...it, movedThisCycle: true } : it)),
      extraItems: [...d.extraItems, newExtraItem],
    };
  });
};

const undimAnnualItem = (id) => {
  setData((d) => ({
    ...d,
    annualItems: d.annualItems.map((it) => (it.id === id ? { ...it, movedThisCycle: false } : it)),
  }));
};

const undimAnnualItems = (ids) => {
  if (!ids || ids.length === 0) return;
  const idSet = new Set(ids);
  setData((d) => ({
    ...d,
    annualItems: d.annualItems.map((it) => (idSet.has(it.id) ? { ...it, movedThisCycle: false } : it)),
  }));
};

const dimAnnualItems = (ids) => {
  if (!ids || ids.length === 0) return;

  const idSet = new Set(ids);

  setData((d) => ({
    ...d,
    annualItems: d.annualItems.map((it) =>
      idSet.has(it.id)
        ? { ...it, movedThisCycle: true }
        : it
    ),
  }));
};

// Copies a monthly item into the One-off spending & deposits list as a new
// (unpaid) item — so it can be tracked precisely against checking/savings —
// and dims it here so its budgeted estimate stops double-counting against
// the monthly expense total while it's being tracked as an actual one-off.
const moveMonthlyItemToOneOff = (id) => {
  setData((d) => {
    const item = d.monthlyItems.find((it) => it.id === id);
    if (!item || item.dimmed) return d;
    const newExtraItem = {
      id: genId(),
      name: item.name,
      account: "checking",
      direction: "subtract",
      amount: item.amount,
      paid: false,
    };
    return {
      ...d,
      monthlyItems: d.monthlyItems.map((it) => (it.id === id ? { ...it, dimmed: true } : it)),
      extraItems: [...d.extraItems, newExtraItem],
    };
  });
};

const undimMonthlyItem = (id) => {
  setData((d) => ({
    ...d,
    monthlyItems: d.monthlyItems.map((it) => (it.id === id ? { ...it, dimmed: false } : it)),
  }));
};

const undimMonthlyItems = (ids) => {
  if (!ids || ids.length === 0) return;
  const idSet = new Set(ids);
  setData((d) => ({
    ...d,
    monthlyItems: d.monthlyItems.map((it) => (idSet.has(it.id) ? { ...it, dimmed: false } : it)),
  }));
};

const dimMonthlyItems = (ids) => {
  if (!ids || ids.length === 0) return;
  const idSet = new Set(ids);
  setData((d) => ({
    ...d,
    monthlyItems: d.monthlyItems.map((it) => (idSet.has(it.id) ? { ...it, dimmed: true } : it)),
  }));
};

// Sweeps whatever is currently sitting in checking (after paid one-off items
// and any automatic overdraft transfer) into savings, resets checking to $0,
// and archives the paid items whose effects are now baked into the balances.
const settleCheckingToSavings = () => {
  setData((d) => {
    const paidItems = d.extraItems.filter((i) => i.paid);
    const checkingAdj = signedTotal(paidItems, "checking");
    const savingsAdj = signedTotal(paidItems, "savings");
    const baseChecking = (parseFloat(d.accounts.checking) || 0) + checkingAdj;
    const baseSavings = (parseFloat(d.accounts.savings) || 0) + savingsAdj;

    let transfer = 0;
    if (baseChecking < 0) {
      transfer = Math.min(-baseChecking, Math.max(baseSavings, 0));
    }
    const currentChecking = baseChecking + transfer;
    const currentSavings = baseSavings - transfer;

    if (currentChecking <= 0) return d;

    setUndoSettle({ accounts: d.accounts, extraItems: d.extraItems });

    return {
      ...d,
      accounts: {
        checking: 0,
        savings: currentSavings + currentChecking,
      },
      extraItems: d.extraItems.filter((i) => !i.paid),
    };
  });
};

const undoSettleChange = () => {
  if (!undoSettle) return;
  setData((d) => ({ ...d, accounts: undoSettle.accounts, extraItems: undoSettle.extraItems }));
  setUndoSettle(null);
};
  const updateAccount = (key) => (value) => {
    setData((d) => ({ ...d, accounts: { ...d.accounts, [key]: value } }));
  };

  const totals = useMemo(() => {
    if (!data) return null;
    const fixed = sum(data.monthlyItems.filter((i) => i.type === "fixed" && !i.dimmed));
    const variable = sum(data.monthlyItems.filter((i) => i.type === "variable" && !i.dimmed));
    const monthly = fixed + variable;
    const dimmedMonthlyItems = data.monthlyItems.filter((i) => i.dimmed);
    const dimmedMonthlyCount = dimmedMonthlyItems.length;
    const dimmedMonthlyTotal = sum(dimmedMonthlyItems);
    const allMonthly = monthly + dimmedMonthlyTotal;
    const annual = sum(data.annualItems);
    const annualMonthly = annual / 12;
    // const totalExpenses = monthly + annualMonthly;
    const totalExpenses = allMonthly;
    const income = sum(data.incomeItems);
    const savings =
      data.savingsMode === "percent"
        ? income * ((parseFloat(data.savingsValue) || 0) / 100)
        : parseFloat(data.savingsValue) || 0;
    const makeIt = income - totalExpenses - savings;

    // const paidExtraItems = data.extraItems.filter((i) => i.paid);
    // const checkingAdj = signedTotal(paidExtraItems, "checking");
    // const savingsAdj = signedTotal(paidExtraItems, "savings");
    // const baseChecking = (parseFloat(data.accounts.checking) || 0) + checkingAdj;
    // const baseSavings = (parseFloat(data.accounts.savings) || 0) + savingsAdj;

    const baseChecking = parseFloat(data.accounts.checking) || 0;
    const baseSavings = parseFloat(data.accounts.savings) || 0;

    // If checking would go negative, automatically pull from savings to cover it
    // (limited to whatever savings actually has available).
    let transfer = 0;
    if (baseChecking < 0) {
      transfer = Math.min(-baseChecking, Math.max(baseSavings, 0));
    }
    const realChecking = baseChecking + transfer;
    const realSavings = baseSavings - transfer;
    const shortfall = realChecking < 0 ? -realChecking : 0;

    return {
      fixed,
      variable,
      monthly,
      dimmedMonthlyCount,
      dimmedMonthlyTotal,
      allMonthly,
      annual,
      annualMonthly,
      totalExpenses,
      income,
      savings,
      makeIt,
      realChecking,
      realSavings,
      transfer,
      shortfall,
    };
  }, [data]);

  if (status === "loading" || !data || !totals) {
    return (
      <div className="ledger-root">
        <div className="loading-state">Opening the ledger…</div>
      </div>
    );
  }

  const barSegments = [
    { key: "fixed", label: "Fixed bills", value: totals.fixed, color: "var(--expense)" },
    { key: "variable", label: "Everyday estimate", value: totals.variable, color: "var(--expense-soft)" },
    ...(totals.dimmedMonthlyTotal > 0
      ? [{ key: "dimmed", label: "Dimmed (tracked as one-off)", value: totals.dimmedMonthlyTotal, color: "var(--ink-soft)" }]
      : []),
    { key: "annual", label: "Annual bills (÷12)", value: totals.annualMonthly, color: "var(--expense-deep)" },
    { key: "savings", label: "Savings", value: totals.savings, color: "var(--savings)" },
    { key: "makeit", label: "Make-it money", value: Math.max(totals.makeIt, 0), color: "var(--income)" },
  ];
  const barTotal = Math.max(totals.income, totals.totalExpenses + totals.savings, 1);

  return (
    <div className="ledger-root">
      <header className="masthead">
        <div className="masthead-top">
          <div>
            <div className="masthead-eyebrow">Household Ledger</div>
            {editingTitle ? (
              <input
                className="masthead-title-input"
                value={titleDraft}
                autoFocus
                onChange={(e) => setTitleDraft(e.target.value)}
                onBlur={() => commitTitle(titleDraft)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") {
                    e.preventDefault();
                    commitTitle(titleDraft);
                  } else if (e.key === "Escape") {
                    e.preventDefault();
                    setTitleDraft(pageTitle);
                    setEditingTitle(false);
                  }
                }}
              />
            ) : (
              <h1
                className="editable-title"
                title="Click to rename"
                onClick={() => {
                  setTitleDraft(pageTitle);
                  setEditingTitle(true);
                }}
              >
                {pageTitle}
              </h1>
            )}
          </div>
          <div className="masthead-meta">
            <button
              className="theme-toggle"
              onClick={toggleTheme}
              title={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
              aria-label={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
            >
              {theme === "dark" ? "🌙 Dark" : "☀️ Light"}
            </button>
            <LiveClock />
            <WeatherWidget />
            {saveState === "saving" && <span className="save-pill">Saving…</span>}
            {saveState === "saved" && <span className="save-pill saved">Saved</span>}
          </div>
        </div>
      </header>

      <div className="strip">
        <div className="strip-item">
          <span className="strip-label">Monthly income</span>
          <span className="strip-value income">{fmt(totals.income)}</span>
        </div>
        <span className="strip-op">−</span>
        <div className="strip-item">
          <span className="strip-label">Monthly expenses</span>
          <span className="strip-value expense">{fmt(totals.totalExpenses)}</span>
        </div>
        <span className="strip-op">−</span>
        <div className="strip-item">
          <span className="strip-label">Savings</span>
          <span className="strip-value savings">{fmt(totals.savings)}</span>
        </div>
        <span className="strip-op">=</span>
        <div className="strip-item strip-final">
          <span className="strip-label">Make-it money (projected)</span>
          <span className={`strip-value ${totals.makeIt < 0 ? "negative" : "income"}`}>
            {fmt(totals.makeIt)}
          </span>
        </div>
      </div>

      <div className="bar">
        {barSegments.map((seg) => (
          <div
            key={seg.key}
            className="bar-seg"
            style={{ width: `${Math.max((seg.value / barTotal) * 100, 0)}%`, background: seg.color }}
            title={`${seg.label}: ${fmt(seg.value)}`}
          />
        ))}
      </div>
      <div className="bar-legend">
        {barSegments.map((seg) => (
          <span key={seg.key} className="legend-item">
            <i style={{ background: seg.color }} /> {seg.label}
          </span>
        ))}
      </div>

      <UpcomingBillsPanel monthlyItems={data.monthlyItems} annualItems={data.annualItems} />

      <section className="ledger-panel wide-panel">
        <div className="panel-head">
          <h2>Real balances</h2>
          <p className="panel-sub">
            Enter your actual bank balances, then log one-off spending or deposits below. Check an item
            and click "Paid" once it's actually happened — that's when it affects the balances here.
            Pending (unchecked) items are just a heads-up list and don't count yet.
          </p>
        </div>

        <div className="balance-inputs">
          <div className="balance-block">
            <span className="field-label">Checking / make-it money balance</span>
            <div className="amount-field big">
              <span className="dollar">$</span>
              <input
                className="cell-input num-input"
                type="number"
                step="0.01"
                value={data.accounts.checking}
                onChange={(e) => updateAccount("checking")(e.target.value === "" ? "" : parseFloat(e.target.value))}
              />
            </div>
            <div className="balance-current">
              <span className="summary-label">
                Current balance
              </span>
              <span className={`summary-value ${totals.realChecking < 0 ? "negative" : "income"}`}>
                {fmt(totals.realChecking)}
              </span>
              {totals.transfer > 0 && (
                <span className="transfer-note">↳ {fmt(totals.transfer)} auto-covered from savings</span>
              )}
              {totals.shortfall > 0 && (
                <span className="shortfall-note">
                  Still short {fmt(totals.shortfall)} — savings can't fully cover this
                </span>
              )}
              <div className="settle-row">
                <button
                  className="add-btn"
                  onClick={settleCheckingToSavings}
                  disabled={totals.realChecking <= 0}
                  title="Move whatever's currently in checking into savings, and reset checking to $0"
                >
                  Move to savings &amp; clear
                </button>
                {undoSettle && (
                  <button className="add-btn" onClick={undoSettleChange}>
                    Undo
                  </button>
                )}
              </div>
            </div>
          </div>

          <div className="balance-block">
            <span className="field-label">Savings / money market balance</span>
            <div className="amount-field big">
              <span className="dollar">$</span>
              <input
                className="cell-input num-input"
                type="number"
                step="0.01"
                value={data.accounts.savings}
                onChange={(e) => updateAccount("savings")(e.target.value === "" ? "" : parseFloat(e.target.value))}
              />
            </div>
            <div className="balance-current">
              <span className="summary-label">
                Current running balance{" "}
                {(totals.savingsAdj !== 0 || totals.transfer > 0) &&
                  `(${[
                    totals.savingsAdj !== 0 ? `${totals.savingsAdj > 0 ? "+" : ""}${fmt(totals.savingsAdj)} from paid items below` : null,
                    totals.transfer > 0 ? `−${fmt(totals.transfer)} moved to checking` : null,
                  ]
                    .filter(Boolean)
                    .join(", ")})`}
              </span>
              <span className={`summary-value ${totals.realSavings < 0 ? "negative" : "savings"}`}>
                {fmt(totals.realSavings)}
              </span>
              {totals.transfer > 0 && (
                <span className="transfer-note">↳ sent {fmt(totals.transfer)} to checking to cover the shortfall</span>
              )}
            </div>
          </div>
        </div>

        <h3 className="sub-heading">One-off spending &amp; deposits</h3>
        <p className="panel-sub small">
          Random purchases, surprise bills, bonuses, gifts — anything outside your regular budget. Check
          the box next to one or more items, then click "Paid" to apply them to the balances above.
        </p>
        <ExtraItemsTable
          items={data.extraItems}
          onChange={updateItem("extraItems")}
          onAdd={addItem("extraItems", { name: "", account: "checking", direction: "subtract", amount: 0, paid: false })}
          onRemove={removeExtraItem}
          onClearAll={clearExtraItems}
          onUndoClear={undoExtraItemsChange}
          canUndoClear={!!undoExtraItems}
          onMarkPaid={markExtraItemsPaid}
          onMarkUnpaid={markExtraItemsUnpaid}
          onUndoPaid={undoMarkPaid}
          canUndoPaid={!!undoPaidExtraItems}
          onReorder={reorderItems("extraItems")}
        />
      </section>

      <div className="grid">
        <MonthlyItemsTable
          items={data.monthlyItems}
          onChange={updateItem("monthlyItems")}
          onAdd={addItem("monthlyItems", { name: "", type: "variable", amount: 0, dimmed: false, dueDay: "" })}
          onRemove={removeItem("monthlyItems")}
          onReorder={reorderItems("monthlyItems")}
          onMoveToOneOff={moveMonthlyItemToOneOff}
          onUndim={undimMonthlyItem}
          onUndimSelected={undimMonthlyItems}
          onDimSelected={dimMonthlyItems}
          addLabel="Add monthly item"
          emptyLabel="No monthly items yet — add your first bill or estimate."
          footerNote={
            <div className="flex flex-col">
              <span>{`Fixed ${fmt(totals.fixed)} + Estimated ${fmt(totals.variable)} = ${fmt(totals.monthly)} / mo.`}</span><br/>
              {totals.dimmedMonthlyCount > 0 && (
                <span className="text-sm opacity-80 mt-1">
                  {totals.dimmedMonthlyCount} item{totals.dimmedMonthlyCount === 1 ? "" : "s"} dimmed — excluded from the total above, but still counted in Monthly expenses up top
                </span>
              )}
            </div>
          }
        />

        <AnnualBillsTable
          items={data.annualItems}
          onChange={updateItem("annualItems")}
          onAdd={addItem("annualItems", { name: "", amount: 0, dueDate: "", movedThisCycle: false })}
          onRemove={removeItem("annualItems")}
          onReorder={reorderItems("annualItems")}
          onMoveToOneOff={moveAnnualItemToOneOff}
          onUndim={undimAnnualItem}
          onUndimSelected={undimAnnualItems}
          onDimSelected={dimAnnualItems}
          addLabel="Add annual bill"
          emptyLabel="No annual bills yet — add propane, Ring, garbage, phone, etc."
          footerNote={
            <div className="flex flex-col">
              <span>{`${fmt(totals.annual)} / yr → ${fmt(totals.annualMonthly)} / mo`}</span><br/>
              <span className="text-sm opacity-80 mt-1">
                Savings remaining: {fmt(totals.realSavings - totals.annual)}
              </span>
            </div>
          }
        />

        <LineItemTable
          title="Income"
          subtitle="Average monthly take-home pay per person or paycheck."
          items={data.incomeItems}
          onChange={updateItem("incomeItems")}
          onAdd={addItem("incomeItems", { name: "", amount: 0 })}
          onRemove={removeItem("incomeItems")}
          onReorder={reorderItems("incomeItems")}
          showType={false}
          addLabel="Add income source"
          emptyLabel="Add your paycheck and your partner's paycheck."
          footerNote={`Total ${fmt(totals.income)} / mo`}
        />

        <section className="ledger-panel savings-panel">
          <div className="panel-head">
            <h2>Savings target</h2>
            <p className="panel-sub">Decide how much of your income goes to savings before the rest becomes "make-it" money.</p>
          </div>

          <div className="savings-controls">
            <div className="type-toggle wide">
              <button
                type="button"
                className={data.savingsMode === "percent" ? "active" : ""}
                onClick={() => setData((d) => ({ ...d, savingsMode: "percent" }))}
              >
                % of income
              </button>
              <button
                type="button"
                className={data.savingsMode === "fixed" ? "active" : ""}
                onClick={() => setData((d) => ({ ...d, savingsMode: "fixed" }))}
              >
                Fixed $ / mo
              </button>
            </div>

            <div className="amount-field big">
              {data.savingsMode === "fixed" && <span className="dollar">$</span>}
              <input
                className="cell-input num-input"
                type="number"
                min="0"
                step={data.savingsMode === "percent" ? "1" : "0.01"}
                value={data.savingsValue}
                onChange={(e) =>
                  setData((d) => ({
                    ...d,
                    savingsValue: e.target.value === "" ? "" : parseFloat(e.target.value),
                  }))
                }
              />
              {data.savingsMode === "percent" && <span className="percent">%</span>}
            </div>
          </div>

          <div className="savings-summary">
            <div>
              <span className="summary-label">Goes to savings</span>
              <span className="summary-value savings">{fmt(totals.savings)} / mo</span>
            </div>
            <div>
              <span className="summary-label">Left over to spend freely</span>
              <span className={`summary-value ${totals.makeIt < 0 ? "negative" : "income"}`}>
                {fmt(totals.makeIt)} / mo
              </span>
            </div>
          </div>
          {totals.makeIt < 0 && (
            <p className="warning">
              You're spending more than you bring in at this savings rate. Try lowering the savings
              target or trimming a monthly item.
            </p>
          )}
        </section>
      </div>

      <ProjectionsPanel 
        income={totals.income} 
        monthlyExpenses={totals.allMonthly} 
        currentSavings={totals.realSavings} 
      />

      <footer className="ledger-footer">
        Figures are stored privately and only visible to you. Annual bills are automatically divided by
        12, and real balances combine your entered starting balance with the one-off items you log.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
